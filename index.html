// ============ scenes, loop, input, boot ============
const loseFrac=()=>[.5,.4,.33,.25][clamp(meta.bld.gate,0,3)];
function resetWorld(){allies=[];en=[];props=[];pickups=[];pproj=[];eproj=[];lobs=[];pools=[];marks=[];fx=[];parts=[];texts=[];bossRef=null;flow=null;$('boss').hidden=true;}
function placePlayer(){pl.x=M.startPos.x;pl.y=M.startPos.y;cam.x=pl.x;cam.y=pl.y-8;pl.dash=null;pl.vx=pl.vy=0;revealT=0;}
function goTown(fromRun){
  scene='town';resetWorld();genTown();run=null;
  pl=newPlayer(meta.cls);refreshStats();pl.hp=pl.maxHp;
  placePlayer();if(fromRun){pl.y=19*T;}
  M.seen.fill(1);
  $('hud').hidden=false;setHint('WASD move · SHIFT sprint · E talk · I gear · C skills · J jobs · ESC options. The shaft in the middle goes down.');
  if(NET.pending&&NET.guest){const r=NET.pending;NET.pending=null;setTimeout(()=>startRun(num(r.start),{seed:num(r.seed),rid:r.rid,fi:num(r.fi),ps:r.ps,df:r.df}),500);}
  if(!meta.stashSeen){meta.stashSeen=true;save();setTimeout(()=>toast('Welcome to the Block. Talk to Amaru, Doc, Mags and Ugandi. The shaft in the plaza leads into the Undercity.','#40e0ff'),600);}
}
function switchRunner(c){meta.cls=c;save();const x=pl.x,y=pl.y;pl=newPlayer(c);refreshStats();pl.hp=pl.maxHp;pl.x=x;pl.y=y;burst(x,y,20,[CLASSES[c].col,'#ffffff'],80);toast(`Now running as ${CLASSES[c].name}`,CLASSES[c].col);}
function startRun(fi,net){
  closePanel();
  if(NET.guest&&!net){toast('Your host starts the run. Hang tight.','#40e0ff');return;}
  run={floor:fi,startFloor:fi,mods:[],chems:[],creds:0,scrap:0,kills:0,keys:0,bossSeen:false,bossDown:false};
  const seed=net?net.seed:RI(1,1e9);NET.rid=net?net.rid:(NET.host?'r'+RI(1,1e9):null);
  run.ps=net?clamp(num(net.ps)||1,1,5):NET.host?1+NET.guests.size:1;run.df=net&&net.df!=null?clamp(num(net.df),0,3):CFG.diff;
  if(NET.host)broadcast({t:'start',fi,seed,rid:NET.rid,ps:run.ps,df:run.df});
  for(const id of (meta.pending||[]))if(MOD[id]&&!run.mods.includes(id))run.mods.push(id);
  meta.pending=[];meta.rumors=null;meta.runs++;save();
  if(perk('bless')){const id=pickMods(1)[0];if(id)run.mods.push(id);}
  pl.stimMax=2+(meta.bld.doc>=2?1:0)+(run.mods.includes('recycler')?1:0)+perk('stim')+upRank('stims');pl.stims=pl.stimMax;
  const ef=net&&net.fi!=null?net.fi:fi;
  sfx('door');fadeTo(()=>enterFloor(ef,seed,run.ps));
}
function enterFloor(fi,seed,ps){
  if(seed==null){seed=RI(1,1e9);ps=NET.host?1+NET.guests.size:1;if(NET.host){NET.rid='r'+RI(1,1e9);broadcast({t:'floor',fi,seed,rid:NET.rid,ps,df:run.df});}}
  run.ps=clamp(ps||run.ps||1,1,5);
  run.floor=fi;run.keys=0;run.bossSeen=false;run.bossDown=false;run.wiped=false;if(fi===2)qEvent('floor3');
  resetWorld();genDungeon(fi,seed,run.ps);
  if(NET.guest){en=[];bossRef=null;}
  else if(NET.host){const n=1+NET.guests.size;run.pm=partyMult(n);const dm=1+.2*(n-1);extraPacks(n);for(const e of en){e.hp*=run.pm;e.max*=run.pm;e.dmg=Math.round(e.dmg*dm);}}
  else run.pm=1;
  if(pl.dead){pl.dead=false;pl.down=false;pl.hp=pl.maxHp*.3;}
  scene='dungeon';refreshStats();if(fi===run.startFloor)pl.hp=pl.maxHp;
  placePlayer();setHint('');
  meta.deepest=Math.max(meta.deepest,fi+1);save();
  banner(themeOf(fi).name,isMega(fi)?'The end of the Act. Kill it and go home.':`Floor ${fi+1} · ${ED[themeOf(fi).boss].name} guards the lift`,2600);
}
function endRun(how){
  if(!run||run.ended)return;run.ended=true;
  if(NET.host)broadcast({t:'end',how:how==='dead'&&!run.wiped?'extract':how});
  const lose=how==='dead'?loseFrac():0;
  const c=Math.floor(run.creds*(1-lose)),s=Math.floor(run.scrap*(1-lose));
  meta.creds+=c;meta.scrap+=s;if(s>0)qEvent('scrap',s);if(c>0)qEvent('bank',c);if(how==='dead')meta.deaths++;if(how==='win')meta.wins++;
  const sum={how,creds:c,scrap:s,kills:run.kills,floor:run.floor,cls:pl.cls,lvl:pl.cd.lvl};
  save();modal='fade';
  fadeTo(()=>{goTown(true);showSummary(sum);});
}
// ---- loop ----
let last=performance.now(),acc=0;
function step(t){
  const dt=Math.min(document.hidden?.08:.033,(t-last)/1000);last=t;time+=dt;acc+=dt;
  if(scene==='title'&&pl){cam.x=23*T+Math.sin(time*.15)*60;cam.y=17*T+Math.cos(time*.11)*30;}
  const live=scene==='town'||scene==='dungeon';
  if(live&&!modal)update(dt,true);
  else if(live&&NET.on&&modal!=='fade')update(dt,false);
  if(!modal||modal==='dying'||modal==='title'||modal==='menu'||NET.on)ambient(dt);
  netTick(dt);musUpdate();achT-=dt;if(achT<=0&&(scene==='town'||scene==='dungeon')){achT=1;achCheck();}
  for(const k in pressed)delete pressed[k];
}
function frame(t){
  step(t);
  render();if(scene!=='title')hud(acc);acc=0;
  requestAnimationFrame(frame);
}
// background tabs freeze requestAnimationFrame; a worker timer keeps the netcode (and the host sim) alive
try{
  const wk=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),50)'],{type:'text/javascript'})));
  wk.onmessage=()=>{if(document.hidden&&NET.on){const t=performance.now();if(t-last>40){for(const k in key)key[k]=false;mouse.l=mouse.r=false;step(t);}}};
}catch(e){}
// ---- input ----
const typing=e=>e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT');
function leaveTitle(){if(modal!=='title')return;initAudio();sfx('door');showMenu();}
$('title').addEventListener('mousedown',leaveTitle);
addEventListener('keydown',e=>{
  initAudio();
  if(modal==='title'){e.preventDefault();leaveTitle();return;}
  if(typing(e)){if(e.code==='Escape')closePanel();return;}
  if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat){key[e.code]=true;return;}
  key[e.code]=true;pressed[e.code]=true;
  if(/^Digit[1-9]$/.test(e.code)&&curOpts&&modal){const o=curOpts[+e.code.slice(5)-1];if(o&&!o.dis)o.f();return;}
  const playing=scene==='town'||scene==='dungeon';
  if(e.code==='KeyT'&&!modal&&scene==='dungeon'){CFG.auto=!CFG.auto;saveCfg();toast(`Autofire ${CFG.auto?'on':'off'}`,'#ffd23a');return;}
  if(e.code==='KeyY'&&!modal&&scene==='dungeon'){CFG.autoCast=!CFG.autoCast;saveCfg();toast(`Auto-cast skills ${CFG.autoCast?'on: your skills fire by themselves':'off'}`,'#c05aff');return;}
  const MK={KeyI:'gear',Tab:'gear',KeyC:'skills',KeyK:'skills',KeyJ:'jobs',KeyU:'chrome'};
  if(MK[e.code]&&playing){const t=MK[e.code];if(modal==='menu'){if(e.code==='Tab'||mmTab===t)closePanel();else openMenu(t);}else if(!modal)openMenu(t);return;}
  if(e.code==='KeyM'&&scene==='dungeon'){if(modal==='map')closePanel();else if(!modal)openMap();return;}
  if(e.code==='Escape'){
    if(['menu','inv','skills','map','options','class','dialog','controls'].includes(modal))closePanel();
    else if(!modal&&playing)showOptions(false);
  }
});
addEventListener('keyup',e=>{key[e.code]=false;});
addEventListener('blur',()=>{for(const k in key)key[k]=false;mouse.l=mouse.r=false;});
function mpos(e){mouse.x=e.clientX/innerWidth*W;mouse.y=e.clientY/innerHeight*H;}
cv.addEventListener('mousemove',mpos);
cv.addEventListener('mousedown',e=>{initAudio();mpos(e);if(e.button===0)mouse.l=true;if(e.button===2)mouse.r=true;});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// ---- boot ----
if(!CLASSES[meta.cls])meta.cls='samurai';
genTown();pl=newPlayer(meta.cls);refreshStats();pl.hp=pl.maxHp;placePlayer();M.seen.fill(1);
showTitle();
requestAnimationFrame(frame);

</script>

</html>
