<style>
/* Layout: full-bleed pixel canvas lit like a rainy neon slum; HUD pinned to corners; panels as dark terminal windows */
:root{
  --void:#06050a;--panel:#0d0b14;--line:#2a2438;--ink:#e6f0ff;--dim:#8a8aa8;
  --pink:#ff2a9a;--cyan:#40e0ff;--yellow:#ffd23a;--green:#7aff5a;--red:#ff2a3a;--violet:#c05aff;
  --neonfont:'Monoton','Silkscreen',ui-monospace,monospace;
  --display:'Silkscreen',ui-monospace,'Courier New',monospace;
  --body:'VT323',ui-monospace,'Courier New',monospace;
  --read:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;background:var(--void);color:var(--ink);font-family:var(--body);font-size:20px;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;display:block}
.ui{position:fixed;pointer-events:none;z-index:5}
.tl{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;width:min(300px,calc(100vw - 32px))}
.bar{position:relative;height:16px;background:#110e18;border:2px solid #000;box-shadow:0 0 0 2px var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;display:block;width:50%}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;letter-spacing:.06em;text-shadow:1px 1px 0 #000}
#hpf{background:linear-gradient(#ff5a8a,var(--pink) 55%,#7a0a40)}
#xpbar{height:12px;width:100%}
#xpbar span{font-size:10px}
#enbar{height:12px}#enbar span{font-size:10px}
#enf{background:linear-gradient(#a8f4ff,var(--cyan) 55%,#0a4a6a)}
#stbar{height:6px;width:70%}
#stf{background:linear-gradient(#fff3b0,var(--yellow))}
#stbar.winded{box-shadow:0 0 0 2px var(--red)}
#stbar.winded i{opacity:.45}
.mod.chem{border-style:dashed}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:stretch}
.slot.noen em{color:#5a6a7a}
.slot.hk{width:62px}.slot.hk em{font-size:14px}
.slot.lock em{color:#3a3448}
.slot.noen b{color:var(--red)}
#xpf{background:linear-gradient(#e0b0ff,var(--violet))}
#lvl{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--dim);text-shadow:1px 1px 0 #000}
.spk{color:var(--yellow)}
#mods{display:flex;flex-wrap:wrap;gap:4px}
.mod{font-family:var(--display);font-size:8px;letter-spacing:.06em;padding:2px 5px;border:1px solid var(--c);color:var(--c);background:rgba(0,0,0,.6)}
.tr{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}
#money{font-family:var(--display);font-size:13px;text-shadow:2px 2px 0 #000}
.cr{color:var(--cyan)} .sc{color:#c8ccd4}
#where{font-family:var(--display);font-size:10px;letter-spacing:.14em;color:var(--pink);text-shadow:0 0 6px rgba(255,42,154,.6),1px 1px 0 #000}
#auto{font-family:var(--display);font-size:9px;letter-spacing:.1em;color:var(--yellow)}
#minimap{width:116px;image-rendering:pixelated;border:2px solid #000;box-shadow:0 0 0 2px var(--line);margin-top:4px;opacity:.92}
#boss{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(460px,calc(100vw - 280px));min-width:200px;display:flex;flex-direction:column;gap:4px;align-items:center}
#boss .bn{font-family:var(--neonfont);font-size:22px;color:var(--red);text-shadow:0 0 10px rgba(255,42,58,.8)}
#boss .bar{width:100%;height:12px}
#bossf{background:linear-gradient(#ff7a7a,var(--red) 60%,#5a0a12)}
#slots{display:flex;gap:6px}
.slot{position:relative;width:76px;height:52px;background:var(--panel);border:2px solid #000;box-shadow:0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding-inline:3px}
.slot b{font-family:var(--display);font-size:10px;color:var(--yellow);letter-spacing:.06em}
.slot em{font-style:normal;font-size:16px;line-height:.95;text-align:center}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--cd,0%);background:rgba(0,0,0,.66)}
.slot.ready{box-shadow:0 0 0 2px var(--line),0 0 10px rgba(64,224,255,.35)}
#prompt{left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--display);font-size:11px;letter-spacing:.08em;background:var(--panel);border:2px solid var(--cyan);padding:6px 12px;box-shadow:0 0 14px rgba(64,224,255,.35);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#prompt kbd{color:var(--yellow);font-family:var(--display)}
#hint{left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:var(--dim);font-size:18px;text-align:center;width:calc(100vw - 32px);text-shadow:1px 1px 0 #000}
#banner{left:0;right:0;top:22%;text-align:center;opacity:0;transition:opacity .35s;padding-inline:16px}
#banner.show{opacity:1}
#banner h2{margin:0;font-family:var(--neonfont);font-weight:400;font-size:clamp(28px,6vw,60px);line-height:1.05;color:#fff;text-shadow:0 0 8px var(--pink),0 0 22px var(--pink),3px 3px 0 #000;text-wrap:balance}
#banner p{margin:.4em 0 0;font-size:24px;color:var(--cyan);text-shadow:2px 2px 0 #000}
#toasts{left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:min(520px,calc(100vw - 32px))}
.toast{background:rgba(13,11,20,.94);border-left:3px solid var(--c);padding:4px 12px;font-size:22px;animation:tin 3.8s forwards}
@keyframes tin{0%{opacity:0;transform:translateX(-10px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .38s;z-index:20}
#title{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 45%,rgba(6,5,10,.25),rgba(6,5,10,.9) 75%);padding:16px;cursor:pointer;text-align:center}
#title h1{margin:0;font-family:var(--neonfont);font-weight:400;font-size:clamp(44px,11vw,140px);line-height:1;color:#fff;text-shadow:0 0 10px var(--pink),0 0 30px var(--pink),0 0 60px rgba(255,42,154,.6);animation:buzz 5s infinite}
#title p{margin:0;font-family:var(--display);font-size:14px;letter-spacing:.3em;color:var(--cyan);animation:blink 1.4s steps(2) infinite;text-shadow:0 0 8px rgba(64,224,255,.8)}
@keyframes blink{50%{opacity:.15}}
@keyframes buzz{0%,89%,93%,100%{opacity:1}90%,92%{opacity:.35}}
#veil{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(4,3,8,.62);padding:16px;overflow:auto}
#panel{font-family:var(--read);font-size:17px;width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid #000;box-shadow:0 0 0 2px var(--cyan),0 0 26px rgba(64,224,255,.2),8px 8px 0 4px #000;padding:18px 20px;margin:auto}
#panel.wide{width:min(940px,100%)}
#panel h1{margin:4px 0 10px;font-family:var(--neonfont);font-weight:400;font-size:clamp(30px,6vw,56px);line-height:1.05;color:#fff;text-shadow:0 0 8px var(--pink),0 0 20px var(--pink);text-wrap:balance}
#panel h1.big{font-size:clamp(36px,8vw,76px)}
#panel h3{margin:4px 0 8px;font-family:var(--display);font-size:16px;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase;text-wrap:balance}
#panel p{margin:.4em 0;line-height:1.12;max-width:66ch}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.18em;color:var(--yellow);text-transform:uppercase}
.dim{color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button{font:inherit;font-size:17px;color:var(--ink);background:#161222;border:2px solid var(--line);padding:6px 14px;cursor:pointer;text-align:left;line-height:1.05}
button:hover:not(:disabled),button:focus-visible{border-color:var(--pink);background:#211830;outline:none;box-shadow:0 0 12px rgba(255,42,154,.35)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{border-color:var(--pink);background:#2a0f22;font-family:var(--display);font-size:13px;letter-spacing:.08em;padding:10px 16px}
button kbd{font-family:var(--display);font-size:10px;color:var(--yellow);margin-right:6px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-width:340px}
.menu button{font-family:var(--display);font-size:14px;letter-spacing:.1em;padding:10px 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.card{display:flex;flex-direction:column;gap:6px;padding:12px;min-width:0;height:100%;border-left:4px solid var(--cc,var(--line))}
.card .pv{height:104px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 75%,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%)}
.card .pv img{height:100px;image-rendering:pixelated}
.card .nm{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:#fff}
.card .tag{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--cc)}
.card .ds{font-size:20px;color:var(--dim);line-height:1.05}
.card .rk{font-family:var(--display);font-size:10px;letter-spacing:.08em;color:var(--cc);margin-top:auto;line-height:1.5}
.dlg{display:flex;gap:16px;align-items:flex-start}
.dlg>div{min-width:0;flex:1}
.dlg .por{height:110px;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 10px rgba(64,224,255,.25))}
.who{font-family:var(--display);font-size:14px;letter-spacing:.12em;color:var(--pink);margin-bottom:4px;text-transform:uppercase}
.dlg p{font-size:21px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px}
.item{border:2px solid var(--line);border-left:3px solid var(--rc,var(--line));background:#08070d;padding:6px 9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.item.empty{color:var(--dim);font-size:17px;border-style:dashed}
.item .in{font-family:var(--display);font-size:12px;letter-spacing:.04em;color:var(--rc)}
.item .is{font-size:18px;color:var(--dim)}
.item ul{margin:2px 0 0;padding:0;list-style:none;font-size:20px;line-height:1.02}
.item .cmp{font-size:18px;line-height:1.05}
.item .act{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.item .act button{font-size:15px;padding:2px 8px}
.up{color:var(--green)} .down{color:var(--red)}
.lbl{font-family:var(--display);font-size:10px;letter-spacing:.14em;color:var(--dim);margin-bottom:2px}
.doll{display:grid;grid-template-columns:minmax(0,1fr) 140px minmax(0,1fr);gap:10px;align-items:start;margin-top:8px}
.doll .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.doll .fig{display:flex;align-items:center;justify-content:center;min-height:220px;background:radial-gradient(circle at 50% 60%,rgba(255,42,154,.16),transparent 70%)}
.doll .fig img{height:170px;image-rendering:pixelated}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px;font-size:18px;margin-top:4px}
.stats.wide{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-block:12px}
.stats b{font-family:var(--display);font-size:8px;color:var(--dim);font-weight:400;letter-spacing:.08em;display:block}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.skill{border:2px solid var(--line);background:#08070d;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.skill p{font-size:21px;margin:0!important}
.skill .nx{font-size:18px}
.sk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sk-h b{font-family:var(--display);font-size:14px;font-weight:400;letter-spacing:.06em;color:#fff}
.slotk{font-family:var(--display);font-size:10px;letter-spacing:.1em;color:var(--yellow);border:1px solid var(--yellow);padding:1px 4px}
.pips{display:flex;gap:3px;margin-left:auto}
.pips i{width:8px;height:8px;border:1px solid var(--cyan);display:block}
.pips i.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.skill button{font-size:19px;padding:3px 10px;align-self:flex-start;margin-top:2px}
.pts{color:var(--yellow);margin-left:8px}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin-top:10px;font-size:19px}
.ctrl kbd{font-family:var(--display);font-size:10px;color:var(--yellow);padding-top:4px;white-space:nowrap}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 16px;margin-top:10px}
.og label{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);background:#08070d;padding:6px 10px;min-width:0}
.og label span{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--dim)}
.og input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink)}
.og input[type=range]{width:120px;accent-color:var(--pink)}
.og select{font:inherit;font-size:18px;background:#06050a;color:var(--ink);border:2px solid var(--line);padding:2px 6px;min-width:0;width:150px}
.bigmap{width:min(100%,520px);image-rendering:pixelated;display:block;margin:6px auto;border:2px solid var(--line)}
#party{display:flex;flex-direction:column;gap:4px;align-items:flex-end;margin-top:4px}
.pm{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:9px;letter-spacing:.06em;text-shadow:1px 1px 0 #000}
.pm .mini{width:60px;height:5px;background:#110e18;border:1px solid #000;position:relative;display:block}
.pm .mini i{position:absolute;inset:0 auto 0 0;background:var(--pink)}
.net{border:2px dashed var(--line);padding:8px 12px;margin-top:12px;font-size:19px;line-height:1.15}
.net b{font-family:var(--display);font-size:10px;letter-spacing:.12em;color:var(--cyan);font-weight:400}
.mpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.mpbox{border:2px solid var(--line);background:#08070d;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.mpbox h4{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.1em;color:#fff;font-weight:400}
.mpbox p{margin:0!important}
.joinrow{display:flex;gap:8px;flex-wrap:wrap}
.joinrow input,.og input[type=text]{font-family:var(--display);font-size:16px;letter-spacing:.2em;text-transform:uppercase;background:#06050a;color:var(--yellow);border:2px solid var(--line);padding:6px 10px;width:130px}
.og input[type=text]{letter-spacing:.06em;text-transform:none;color:var(--ink);font-size:13px;width:160px}
.joinrow input:focus-visible,.og input:focus-visible{outline:2px solid var(--pink)}
.mpstatus{min-height:1.2em;color:var(--cyan)}
@media (max-width:900px){.slot.hk{width:50px}.slot{width:60px}.slot em{font-size:13px}}
@media (max-width:640px){#slots{gap:3px}.slot{width:58px;height:46px}.slot em{font-size:13px}.doll{grid-template-columns:1fr}.doll .fig{min-height:120px}.doll .fig img{height:110px}#minimap{width:84px}.dlg{flex-direction:column}.dlg .por{height:70px}}

/* ===== unified netrunner menu ===== */
#netbg{position:fixed;inset:0;width:100vw;height:100vh;display:none;image-rendering:pixelated;z-index:-1}
#veil.net{background:rgba(2,2,6,.55)}
#veil.net #netbg{display:block}
#veil{isolation:isolate}
#panel.mm{width:min(1120px,100%);padding:0;background:linear-gradient(180deg,rgba(10,8,20,.94),rgba(6,5,12,.96));box-shadow:0 0 0 2px var(--cyan),0 0 40px rgba(64,224,255,.25),0 0 0 6px rgba(255,42,154,.12);clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px))}
.mm-top{display:flex;align-items:stretch;gap:0;border-bottom:2px solid rgba(64,224,255,.35);background:rgba(64,224,255,.05);flex-wrap:wrap}
.mm-tab{font-family:var(--display);font-size:14px;letter-spacing:.14em;padding:12px 18px;border:0;border-right:1px solid rgba(64,224,255,.2);background:none;color:var(--dim);position:relative}
.mm-tab kbd{font-size:11px}
.mm-tab.on{color:#fff;background:rgba(255,42,154,.14);text-shadow:0 0 8px var(--pink)}
.mm-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.mm-tab .dot{display:inline-block;width:6px;height:6px;background:var(--yellow);margin-left:6px;box-shadow:0 0 6px var(--yellow);vertical-align:middle}
.mm-who{margin-left:auto;align-self:center;padding:0 14px;font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--cyan)}
.mm-x{border:0;border-left:1px solid rgba(64,224,255,.2);background:none;font-family:var(--display);font-size:13px;padding:0 16px;color:var(--dim)}
.mm-body{padding:16px 18px 18px;min-height:420px}
.mm h4{margin:0 0 10px;font-family:var(--display);font-size:13px;letter-spacing:.16em;color:var(--cyan);font-weight:400;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gear{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:16px;align-items:start}
.doll2{display:grid;grid-template-columns:repeat(3,92px);grid-template-rows:repeat(3,auto);gap:8px;justify-content:center;padding:10px;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--cc) 20%,transparent),transparent 65%);border:1px solid rgba(64,224,255,.18)}
.doll2 .figc{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center}
.doll2 .figc img{height:116px;image-rendering:pixelated;filter:drop-shadow(0 0 10px var(--cc))}
.cell{position:relative;height:92px;border:2px solid #1e1a2c;border-color:var(--rc,#1e1a2c);background:linear-gradient(180deg,#0c0a14,#06050a);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font-size:14px;line-height:1;overflow:hidden;min-width:0}
.cell:hover,.cell.sel{box-shadow:0 0 0 1px var(--rc,var(--cyan)),0 0 14px color-mix(in srgb,var(--rc,var(--cyan)) 55%,transparent);background:linear-gradient(180deg,#141022,#08060e)}
.cell .sl{font-family:var(--display);font-size:9px;letter-spacing:.14em;color:var(--dim)}
.cell .nm{font-family:var(--read);font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--rc,#fff);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cell .ic{position:absolute;right:4px;top:4px;width:10px;height:10px;background:var(--rc);box-shadow:0 0 8px var(--rc)}
.cell.empty{border-style:dashed;border-color:#2a2438;cursor:default}
.cell.empty .nm{color:#3a3448}
.cell .cl{font-size:15px;color:var(--yellow)}
.cell .bet{position:absolute;right:4px;bottom:3px;font-family:var(--display);font-size:9px;color:var(--green)}
.bag2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bag2 .cell{height:84px}
.stat2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px}
.stat2 div{border:1px solid rgba(64,224,255,.15);padding:3px 6px;font-size:21px;background:rgba(0,0,0,.3)}
.stat2 b{display:block;font-family:var(--display);font-size:9px;letter-spacing:.12em;color:var(--dim);font-weight:400}
.detail{border:1px solid rgba(255,42,154,.35);background:rgba(0,0,0,.35);padding:10px;min-height:260px;display:flex;flex-direction:column;gap:6px}
.detail .item{border:0;background:none;padding:0}
.detail .item .in{font-size:15px}
.detail .item ul{font-size:22px}
.detail .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.detail .acts button{font-size:16px;padding:4px 10px}
.detail .hint{color:var(--dim);font-size:20px}
.tgl{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--dim);cursor:pointer}
.tgl input{accent-color:var(--pink);width:16px;height:16px}
.mini-btn{font-family:var(--display);font-size:11px;letter-spacing:.1em;padding:4px 8px}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.job{border:1px solid rgba(64,224,255,.2);background:rgba(0,0,0,.35);padding:10px;display:flex;flex-direction:column;gap:6px}
.job .who{margin:0}
.jq{border-left:3px solid #2a2438;padding:5px 9px;font-size:20px;line-height:1.1}
.jq b{font-family:var(--display);font-size:12px;font-weight:400;letter-spacing:.06em;color:#fff;display:block;margin-bottom:2px}
.jq.done{border-color:var(--green);opacity:.65}
.jq.act{border-color:var(--cyan)}
.jq.rdy{border-color:var(--yellow);box-shadow:0 0 12px rgba(255,210,58,.2)}
.jq.lock{opacity:.35}
.jq .pr{height:5px;background:#110e18;margin-top:4px;position:relative}
.jq .pr i{position:absolute;inset:0 auto 0 0;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.jq .pk{color:var(--green);font-size:18px}
.renown{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--display);font-size:12px;flex-wrap:wrap;letter-spacing:.12em;color:var(--yellow)}
.renown .pr{flex:1;max-width:340px;height:8px;background:#110e18;position:relative;border:1px solid #000}
.renown .pr i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pink),var(--yellow))}
.skg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.skg .skill{border-color:rgba(64,224,255,.2);background:rgba(0,0,0,.35)}
.tier{margin-top:6px}.tierh{font-family:var(--display);font-size:13px;letter-spacing:.16em;margin:6px 0}.tierl{width:2px;height:14px;margin:4px auto;opacity:.6;box-shadow:0 0 8px currentColor}
.gb{color:var(--green);font-family:var(--display);font-size:10px;letter-spacing:.08em}
.runl{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:980px){.gear{grid-template-columns:1fr}.doll2{grid-template-columns:repeat(3,80px)}.bag2{grid-template-columns:repeat(4,minmax(0,1fr))}}
#panel p,#panel .dlg p{font-size:18px;line-height:1.3}
#panel p b{font-family:inherit;font-size:inherit;letter-spacing:0}
#panel .jq{font-size:16px;line-height:1.3}#panel .jq .pk{font-size:15px}
#panel .skill p{font-size:16px;line-height:1.3}#panel .skill .nx{font-size:14px}
#panel .item ul{font-size:16px;line-height:1.3}#panel .item .is{font-size:14px}#panel .item .cmp{font-size:14px}
#panel .detail .item ul{font-size:18px}#panel .card .ds{font-size:15px;line-height:1.25}
#panel .stat2 div{font-size:17px;font-weight:600}#panel .opts button{font-size:17px}#panel .og select{font-size:15px}
#panel .ctrl{font-size:16px}#panel .net{font-size:16px}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:.01s}#banner,#fade{transition:none}#title p,#title h1{animation:none}}

  const c=SFX[n];if(!c)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=c[0];o.frequency.setValueAtTime(c[1],t);o.frequency.exponentialRampToValueAtTime(c[2],t+c[4]);

function mkSprite(rows,pal){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const mk=(flip,mode)=>{
    const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');
    const at=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return '.';const ch=rows[y][flip?w-1-x:x]||'.';return ch===' '?'.':ch;};
    g.fillStyle=mode==='elite'?'#ffcc20':'#050307';
    for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(at(x,y)!=='.')continue;if(at(x+1,y)!=='.'||at(x-1,y)!=='.'||at(x,y+1)!=='.'||at(x,y-1)!=='.')g.fillRect(x+1,y+1,1,1);}
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=at(x,y);if(ch==='.')continue;g.fillStyle=mode==='white'?'#ffffff':(pal[ch]||'#f0f');g.fillRect(x+1,y+1,1,1);}
    if(mode!=='white'){g.globalCompositeOperation='source-atop';g.fillStyle='rgba(180,240,255,.14)';
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(at(x,y)!=='.'&&(at(x-1,y)==='.'||at(x,y-1)==='.'))g.fillRect(x+1,y+1,1,1);}
      g.globalCompositeOperation='source-over';}
    return c;
  };
  return {w:w+2,h:h+2,n:mk(0),f:mk(1),wn:mk(0,'white'),wf:mk(1,'white'),en:mk(0,'elite'),ef:mk(1,'elite')};
}

}

    if(!circleHitsWall(e.x,e.y+sy,e.r))e.y+=sy;

}
function los(ax,ay,bx,by){

// ---- flow field toward the player ----
let flow=null,flowT=0;

  for(const p of srcs){const s=Math.floor(p.y/T)*w+Math.floor(p.x/T);if(s<0||s>=w*h||flow[s]===0)continue;flow[s]=0;q[qt++]=s;}
  while(qh<qt){const c=q[qh++],cx=c%w,cy=(c/w)|0,d=flow[c];if(d>40)continue;
    for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+ox,ny=cy+oy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const n=ny*w+nx;if(flow[n]>=0||!walkT(M.t[n]))continue;flow[n]=d+1;q[qt++]=n;}}
}

function genDungeon(fi,seed,ps){
  const rnd=mulberry(seed),Rr=(a,b)=>Math.floor(a+rnd()*(b-a+1)),grow=1+.16*((ps||1)-1);
  const th=themeOf(fi),kind=th.kind,boss=isMega(fi);
  const w=Math.round((boss?92:96)*grow),h=Math.round((boss?88:78)*grow);
  newMap(w,h,th,kind,seed);
  const rooms=[];
  const fits=(x,y,rw,rh)=>x>=2&&y>=3&&x+rw<w-2&&y+rh<h-2&&!rooms.some(r=>x<r.x+r.w+2&&x+rw+2>r.x&&y<r.y+r.h+2&&y+rh+2>r.y);
  if(boss){for(let t=0;t<300;t++){const rw=26,rh=20,x=Rr(3,w-rw-3),y=Rr(3,h-rh-3);if((x<14||x>w-rw-14||y<14||y>h-rh-14)&&fits(x,y,rw,rh)){rooms.push({x,y,w:rw,h:rh,boss:true,shape:'rect'});break;}}}
  // one big plaza, then a spread of halls, caverns and pillared rooms
  for(let n=0;n<(boss?1:2);n++)for(let t=0;t<200;t++){const rw=Rr(20,26),rh=Rr(15,19),x=Rr(3,w-rw-3),y=Rr(3,h-rh-3);if(fits(x,y,rw,rh)){rooms.push({x,y,w:rw,h:rh,shape:'plaza'});break;}}
  for(let t=0;t<2500&&rooms.length<22+4*((ps||1)-1);t++){const rw=Rr(10,20),rh=Rr(8,15),x=Rr(2,w-rw-3),y=Rr(3,h-rh-3);if(fits(x,y,rw,rh)){const k=rnd();rooms.push({x,y,w:rw,h:rh,shape:k<.35?'cave':k<.55&&rw>=12&&rh>=10?'pillars':'rect'});}}
  for(const r of rooms){r.cx=Math.floor(r.x+r.w/2);r.cy=Math.floor(r.y+r.h/2);
    if(r.shape==='cave')carveBlob(r,rnd);else carveRect(r.x,r.y,r.w,r.h);
    if(r.shape==='pillars')for(let j=r.y+3;j<r.y+r.h-3;j+=4)for(let i=r.x+3;i<r.x+r.w-3;i+=5)if(Math.abs(i-r.cx)>1||Math.abs(j-r.cy)>1)setTile(i,j,WALL);
    if(r.shape==='plaza'){for(let k=0;k<4;k++){const bx=Rr(r.x+3,r.x+r.w-5),by=Rr(r.y+3,r.y+r.h-5);if(Math.abs(bx-r.cx)<4&&Math.abs(by-r.cy)<4)continue;carveRect(bx,by,2,2,WALL);}}}
  // MST (Prim) + loops, wide corridors
  const inT=[0],edges=[],deg=new Array(rooms.length).fill(0);
  while(inT.length<rooms.length){let best=null;for(const a of inT)for(let b=0;b<rooms.length;b++){if(inT.includes(b))continue;const d=Math.hypot(rooms[a].cx-rooms[b].cx,rooms[a].cy-rooms[b].cy);if(!best||d<best[2])best=[a,b,d];}inT.push(best[1]);edges.push(best);deg[best[0]]++;deg[best[1]]++;}
  for(const [a,b] of edges)carveCorridor(rooms[a].cx,rooms[a].cy,rooms[b].cx,rooms[b].cy,rnd,Rr(3,4));
  let si=0;
  if(boss){const bi=rooms.findIndex(r=>r.boss);let bd=-1;rooms.forEach((r,i)=>{const d=Math.hypot(r.cx-rooms[bi].cx,r.cy-rooms[bi].cy);if(!r.boss&&r.shape!=='plaza'&&d>bd){bd=d;si=i;}});}
  else{const c=rooms.map((r,i)=>i).filter(i=>rooms[i].shape!=='plaza');si=c[Math.floor(rnd()*c.length)];}
  const D=bfsFrom(rooms[si].cx,rooms[si].cy);
  let ei=boss?rooms.findIndex(r=>r.boss):0,ed=-1;
  if(!boss){const big=rooms.some((r,i)=>i!==si&&r.w>=13&&r.h>=10&&r.shape!=='pillars');rooms.forEach((r,i)=>{const d=D[r.cy*w+r.cx];if(i!==si&&d>ed&&(!big||r.w>=13&&r.h>=10&&r.shape!=='pillars')){ed=d;ei=i;}});}
  const leaves=rooms.map((r,i)=>i).filter(i=>deg[i]===1&&i!==si&&i!==ei&&rooms[i].shape!=='plaza');
  const vi=leaves.length?leaves[Math.floor(rnd()*leaves.length)]:-1;
  for(let k=0;k<6;k++){const a=Math.floor(rnd()*rooms.length),b=Math.floor(rnd()*rooms.length);if(a===b||a===vi||b===vi||a===ei&&boss||b===ei&&boss)continue;carveCorridor(rooms[a].cx,rooms[a].cy,rooms[b].cx,rooms[b].cy,rnd,Rr(2,3));}
  rooms.forEach((r,i)=>{r.i=i;r.start=i===si;r.exit=i===ei;});
  let vault=null;
  if(vi>=0){const r=rooms[vi],open=[];
    for(let x=r.x-1;x<=r.x+r.w;x++)for(const y of [r.y-1,r.y+r.h])if(walkT(tileAt(x,y)))open.push([x,y]);
    for(let y=r.y;y<r.y+r.h;y++)for(const x of [r.x-1,r.x+r.w])if(walkT(tileAt(x,y)))open.push([x,y]);
    if(r.shape==='cave'){/* cave edges are ragged; seal them with the bounding box test above only if it is clean */}
    if(open.length&&open.length<=10){for(const [x,y] of open)setTile(x,y,VDOOR);r.vault=true;vault={r,cells:open};}}
  if(kind==='sewer'||kind==='foundry'){for(const r of rooms){if(r.start||r.boss||rnd()>.5)continue;const pw=Math.max(2,r.w-6),ph=Math.max(1,Math.floor(r.h/2)-2);const px=r.x+3,py=r.y+Math.floor((r.h-ph)/2);for(let j=py;j<py+ph;j++)for(let i=px;i<px+pw;i++)if(tileAt(i,j)===FLOOR&&(Math.abs(i-r.cx)>1||Math.abs(j-r.cy)>1))setTile(i,j,WATER);}
    for(let i=0;i<w*h;i++){if(M.t[i]===FLOOR&&!rooms.some(r=>{const x=i%w,y=(i/w)|0;return x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;})&&hash(i%w,(i/w)|0)<.35)M.t[i]=WATER;}}
  if(kind==='hive'){for(const r of rooms){if(r.start||r.boss||rnd()<.45)continue;const n=Rr(1,3);for(let k=0;k<n;k++){const px=r.x+2+Math.floor(rnd()*(r.w-6)),py=r.y+2+Math.floor(rnd()*(r.h-4));for(let j=py;j<py+2;j++)for(let i=px;i<px+Rr(2,4);i++)if(tileAt(i,j)===FLOOR&&(Math.abs(i-r.cx)>1||Math.abs(j-r.cy)>1))setTile(i,j,WATER);}}}
  if(kind==='gutter'){for(const r of rooms){if(rnd()<.4&&!r.start){const px=r.x+2+Math.floor(rnd()*(r.w-5)),py=r.y+2+Math.floor(rnd()*(r.h-4));for(let i=px;i<px+3;i++)if(tileAt(i,py)===FLOOR)setTile(i,py,WATER);}}}
  M.rooms=rooms;M.vault=vault;M.fi=fi;
  const faces=[];
  for(let y=1;y<h-1;y++)for(let x=1;x<w-2;x++)if(tileAt(x,y)===WALL&&tileAt(x+1,y)===WALL&&walkT(tileAt(x,y+1))&&walkT(tileAt(x+1,y+1))&&tileAt(x,y-1)===WALL)faces.push([x,y]);
  shuffle(faces,rnd);
  const used=new Set();
  for(const [x,y] of faces){if(M.signs.length>=26)break;if(used.has(y*w+x)||used.has(y*w+x+1)||used.has(y*w+x-1)||used.has(y*w+x+2))continue;
    const text=th.signs[Math.floor(rnd()*th.signs.length)],span=Math.ceil((pxW(text)+8)/T);let ok=true;for(let k=0;k<span;k++)if(!(tileAt(x+k,y)===WALL&&walkT(tileAt(x+k,y+1))))ok=false;if(!ok)continue;
    for(let k=-1;k<=span;k++)used.add(y*w+x+k);
    const col=th.neon[Math.floor(rnd()*th.neon.length)];M.signs.push({tx:x,ty:y,span,text,col});M.lights.push({x:(x+span/2)*T,y:y*T+14,r:70,col,a:.9,flick:rnd()<.25});}
  for(const [x,y] of faces.slice(0,110))if(rnd()<.35&&!used.has(y*w+x)){M.lights.push({x:x*T+8,y:y*T+12,r:46,col:th.neon[Math.floor(rnd()*th.neon.length)],a:.55,lamp:true});used.add(y*w+x);M.lamps=(M.lamps||[]);M.lamps.push([x,y]);}
  populateDungeon(rnd);
  renderMapCanvas();
  for(const [x,y] of (M.lamps||[]))addDecal(g=>{g.fillStyle='#e8f8ff';g.fillRect(x*T+6,y*T+10,4,2);g.fillStyle='#444';g.fillRect(x*T+5,y*T+9,6,1);});
}

function genTown(){
  const w=46,h=36;newMap(w,h,TOWN_THEME,'town',4242);
  carveRect(3,4,w-6,h-8);
  const blds=[
    {k:'doc',x:5,y:4,w:8,h:5,sign:'RIPPERDOC',col:'#40e0ff'},
    {k:'mags',x:17,y:4,w:9,h:5,sign:'GUNS',col:'#ff6a1a'},
    {k:'bar',x:30,y:4,w:10,h:6,sign:'LAST LIGHT',col:'#ff2a9a'},
    {k:'bunk',x:4,y:20,w:7,h:5,sign:'BUNK',col:'#ffd23a'}
  ];
  M.blds=blds;
  for(const b of blds){for(let j=b.y;j<b.y+b.h;j++)for(let i=b.x;i<b.x+b.w;i++)setTile(i,j,WALL);
    b.nx=b.x+Math.floor(b.w/2)-1;b.ny=b.y+b.h-2;carveRect(b.nx,b.ny,2,2);
    const span=Math.max(2,Math.ceil((pxW(b.sign)+8)/T)),left=b.nx-b.x,right=b.x+b.w-(b.nx+2);
    const tx=left>=span?b.x+Math.floor((left-span)/2):right>=span?b.nx+2+Math.floor((right-span)/2):b.x;
    M.signs.push({tx,ty:b.y+b.h-1,span,text:b.sign,col:b.col});}
  for(const s of M.signs){s.ty=Math.min(s.ty,h-1);M.lights.push({x:(s.tx+s.span/2)*T,y:s.ty*T+14,r:90,col:s.col,a:1,flick:s.text==='BUNK'});}
  // puddles
  for(const [x,y,pw,ph] of [[14,15,3,1],[30,22,4,2],[9,28,2,1],[36,14,2,1],[24,27,3,1]])carveRect(x,y,pw,ph,WATER);
  M.rooms=[{x:3,y:4,w:w-6,h:h-8,cx:23,cy:18}];
  renderMapCanvas();
  drawFacades(blds);
  // barricade: stacked containers along the inner border and the gate
  const g=M.canvas.getContext('2d');
  const cont=['#3a2a2a','#2a3a3a','#3a3a2a','#2a2a3e','#4a2222'];
  for(let x=3;x<w-3;x+=3){const c=cont[(x*7)%5];g.fillStyle=c;g.fillRect(x*T,3*T-2,3*T-2,T+2);g.fillStyle='rgba(0,0,0,.35)';for(let k=2;k<3*T;k+=4)g.fillRect(x*T+k,3*T,1,T-2);}
  for(let x=3;x<w-3;x+=3){if(x>=20&&x<=24)continue;const c=cont[(x*3)%5];g.fillStyle=c;g.fillRect(x*T,(h-4)*T,3*T-2,T+4);g.fillStyle='rgba(0,0,0,.35)';for(let k=2;k<3*T;k+=4)g.fillRect(x*T+k,(h-4)*T+2,1,T);}
  // gate in the south barricade
  for(let x=21;x<=24;x++){setTile(x,h-4,WALL);}
  g.fillStyle='#2a2830';g.fillRect(21*T,(h-4)*T-6,4*T,T+10);g.fillStyle='#3e3a44';for(let k=0;k<4*T;k+=6)g.fillRect(21*T+k,(h-4)*T-6,3,T+10);
  g.fillStyle='#ffd23a';for(let k=0;k<4*T;k+=8){g.fillRect(21*T+k,(h-4)*T+T-2,4,2);}
  pxText(g,'NO WAY OUT',22*T-3,(h-4)*T-1,'#ff3a3a','rgba(255,0,0,.3)');
  M.lights.push({x:23*T,y:(h-4)*T,r:60,col:'#ff3a3a',a:.6,flick:true});
  populateTown();
}

function drawFacades(blds){
  const g=M.canvas.getContext('2d'),rnd=mulberry(77);
  const base={doc:'#1c262c',mags:'#2a2420',bar:'#281824',bunk:'#24222a'},awn={doc:['#40e0ff','#0a2a33'],mags:['#ff6a1a','#2a1408'],bar:['#ff2a9a','#2a0a1a'],bunk:['#ffd23a','#2a2208']};
  for(const b of blds){
    const x0=b.x*T,y0=b.y*T,w=b.w*T,h=b.h*T;
    g.fillStyle=base[b.k];g.fillRect(x0,y0,w,h);
    for(let yy=y0+9;yy<y0+h;yy+=7){g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x0,yy,w,1);}
    for(let xx=x0;xx<x0+w;xx+=T*2){g.fillStyle='rgba(255,255,255,.04)';g.fillRect(xx,y0,1,h);}
    g.fillStyle='#0a090e';g.fillRect(x0-1,y0-4,w+2,8);g.fillStyle='rgba(255,255,255,.1)';g.fillRect(x0-1,y0+4,w+2,1);
    // windows
    for(let wy=y0+10;wy<y0+h-2*T-4;wy+=12)for(let wx=x0+5;wx<x0+w-9;wx+=13){
      const lit=rnd()<.55,col=pick(['#ffcf8a','#40e0ff','#ff6aa0','#ffcf8a','#c8a0ff']);
      g.fillStyle='#050408';g.fillRect(wx-1,wy-1,10,8);g.fillStyle=lit?col:'#141218';g.fillRect(wx,wy,8,6);
      if(lit){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(wx+3,wy,1,6);M.lights.push({x:wx+4,y:wy+3,r:22,col,a:.45});}
    }
    // pipes and an AC unit
    g.fillStyle='#3a3a40';g.fillRect(x0+w-5,y0+4,2,h-4);g.fillStyle='#4e4e56';g.fillRect(x0+w-5,y0+4,1,h-4);
    g.fillStyle='#2e3036';g.fillRect(x0+3,y0+h-2*T-2,10,7);g.fillStyle='#1a1c20';for(let k=0;k<3;k++)g.fillRect(x0+4,y0+h-2*T-1+k*2,8,1);
    // doorway, awning
    const dx=b.nx*T,dy=b.ny*T;
    const gr=g.createLinearGradient(0,dy,0,dy+2*T);gr.addColorStop(0,'#0a0608');gr.addColorStop(1,'#2a1a14');g.fillStyle=gr;g.fillRect(dx,dy,2*T,2*T);
    const [a1,a2]=awn[b.k];for(let k=0;k<2*T+8;k+=4){g.fillStyle=(k/4)%2?a1:a2;g.fillRect(dx-4+k,dy-6,4,6);}
    g.fillStyle='rgba(0,0,0,.4)';g.fillRect(dx-4,dy,2*T+8,2);
    M.lights.push({x:dx+T,y:dy+T,r:46,col:'#ffb070',a:.7});
  }
  drawSigns(g);
}

// ============ world: player, stats, items, enemies, props, combat ============
let scene='title',modal='title',time=0;
let pl=null,st=null,run=null;
let en=[],props=[],pickups=[],pproj=[],eproj=[],lobs=[],pools=[],marks=[],fx=[],parts=[],texts=[],lights=[];
let cam={x:0,y:0},shake=0,shX=0,shY=0,hurtFlash=0,near=null,revealT=0,saveT=0,bossRef=null;

// ---- character persistence ----
function charData(cls){
  if(!meta.chars[cls]||typeof meta.chars[cls]!=='object')meta.chars[cls]={};
  const c=meta.chars[cls];
  c.lvl=Math.max(1,num(c.lvl)||1);c.xp=num(c.xp);c.sp=num(c.sp);
  if(!c.ranks||typeof c.ranks!=='object')c.ranks={};
  for(const s of SKILLS[cls])if(c.ranks[s.id]==null)c.ranks[s.id]=s.start;
  if(!c.gear||typeof c.gear!=='object')c.gear={};
  if(!Array.isArray(c.bag))c.bag=[];
  return c;
}
const xpNext=l=>25+l*l*6;
function gearRk(id){let v=0;for(const k of SLOTS){const it=pl.cd.gear[k];if(it&&Array.isArray(it.aff))for(const a of it.aff)if(a.k==='sk'&&a.id===id)v+=num(a.v);}return v;}
const rk=id=>pl?((pl.cd.ranks[id]||0)+gearRk(id)):0;
// ---- hub quests & camp perks ----
function qState(){if(!meta.q||typeof meta.q!=='object')meta.q={};if(!Array.isArray(meta.qDone))meta.qDone=[];return meta.q;}
function qActive(npc){qState();return QUESTS.find(q=>q.npc===npc&&!meta.qDone.includes(q.id))||null;}
function qReady(q){return !!q&&num(meta.q[q.id])>=q.n;}
function qEvent(ev,n){qState();if(!meta.st||typeof meta.st!=='object')meta.st={};meta.st[ev]=num(meta.st[ev])+(n||1);for(const npc in QNPC){const q=qActive(npc);if(!q||q.ev!==ev||qReady(q))continue;meta.q[q.id]=Math.min(q.n,num(meta.q[q.id])+(n||1));if(qReady(q)){toast(`Job done: <b>${q.name}</b>. See ${QNPC[npc]} in the Block.`,'#ffd23a');sfx('lvl');save();}}}
function perk(k){qState();let v=0;for(const id of meta.qDone){const q=QUESTS.find(x=>x.id===id);if(q&&q.fx[k])v+=q.fx[k];}return v;}
const renown=()=>(qState(),meta.qDone.length);
// ---- feats & meta upgrades ----
const upRank=id=>num((meta.up||{})[id]);
const upCost=u=>u.cost*(upRank(u.id)+1);
function allAchs(){return ACHS.concat(classAchs());}
let achT=0;
function achCheck(){
  if(!Array.isArray(meta.ach))meta.ach=[];meta.shards=num(meta.shards);
  for(const a of allAchs()){if(meta.ach.includes(a.id))continue;let ok=false;try{ok=a.t();}catch(e){}
    if(ok){meta.ach.push(a.id);meta.shards+=a.sh;save();toast(`<b style="color:#c05aff">FEAT: ${a.name}</b> · +${a.sh} ◆ shards`,'#c05aff');sfx('lvl');}}
}
function buyUpg(u){if(upRank(u.id)>=u.max||num(meta.shards)<upCost(u))return false;meta.shards-=upCost(u);meta.up=meta.up||{};meta.up[u.id]=upRank(u.id)+1;save();refreshStats();sfx('buy');return true;}
const hasMod=id=>!!(run&&run.mods.includes(id));

function newPlayer(cls){
  if(!CLASSES[cls])cls='samurai';
  const cd=charData(cls);
  return {cls,cd,x:0,y:0,r:5,hp:1,maxHp:1,face:1,aim:{x:1,y:0},aimPt:{x:0,y:0},moving:false,mvx:0,mvy:0,
    cdP:0,mxP:.4,cdR:0,cdQ:0,cdD:0,mxR:1,mxQ:1,mxD:1,combo:0,comboT:0,frenzy:0,over:0,dash:null,ifr:0,stims:2,stimMax:2,
    hitN:0,wardCd:0,walkT:0,dead:false,en:100,maxEn:100,sta:100,maxSta:100,staT:0,winded:false,sprint:false};
}
function S(){
  const s={hp:0,dmg:0,as:0,crit:5,arm:0,ms:0,ls:0,cdr:0,find:0,en:0,enR:0,stR:0,hpPct:0,critD:0,sta:0,stims:0};
  if(!pl)return s;
  for(const k of SLOTS){const it=pl.cd.gear[k];if(it&&Array.isArray(it.aff))for(const a of it.aff)if(a.k in s)s[a.k]+=num(a.v);}
  for(const k of ['hp','dmg','as','ms','arm','find','en','stR'])s[k]+=perk(k);
  for(const u of UPG)s[u.k]+=u.v*upRank(u.id);
  for(const id of (run&&run.chems)||[]){const ch=CHEM[id];if(ch)for(const k in ch.fx)s[k]+=ch.fx[k];}
  const c=CLASSES[pl.cls],b=meta.bld.doc;
  s.hp+=c.hp+(pl.cd.lvl-1)*6+[0,15,30,50][b]+rk('fur')*12+(hasMod('heart')?30:0);
  s.dmg+=hasMod('hollow')?20:0;
  s.as+=(hasMod('twitch')?18:0)+(pl.over>0?40:0)+(pl.frenzy>0?40:0);
  s.crit+=(hasMod('eyes')?10:0)+rk('overload')*5;s.as+=rk('quickdraw')*10;s.cdr+=rk('attune')*8;
  s.arm+=rk('chromeskin')*6+rk('plate')*5+rk('shell')*6;s.crit+=rk('weak')*6;s.ms+=rk('photon')*5;s.en+=rk('capac')*15;s.cdr+=rk('horizon')*8;s.find+=rk('scrapper')*10;
  if(pl.ovwT>0){s.as+=40;s.dmg+=15+5*rk('ovw');}if(pl.odT>0){s.as+=30;s.dmg+=30;}if(pl.ovcT>0)s.as+=30;if(pl.eclT>0)s.ls+=6;s.arm=clamp(s.arm,-50,60);
  s.ms+=pl.frenzy>0?25:0;
  s.ls+=(hasMod('leech')?4:0)+(pl.over>0?4+2*rk('overclock'):0);
  s.cdr=Math.min(s.cdr,50);
  s.find+=meta.bld.bar*10+(hasMod('lucky')?35:0);
  s.hp*=Math.max(.3,1+s.hpPct/100);s.crit=Math.max(0,s.crit);
  return s;
}
function refreshStats(){st=S();pl.maxEn=100+st.en;pl.en=Math.min(pl.en==null?pl.maxEn:pl.en,pl.maxEn);const old=pl.maxHp;pl.maxHp=Math.round(st.hp);if(pl.maxHp>old&&old>1)pl.hp+=pl.maxHp-old;pl.hp=Math.min(pl.hp,pl.maxHp);}

// ---- items ----
function genItem(ilvl,minR,boost,slot){
  slot=slot||pick(SLOTS);boost=boost||0;
  const roll=Math.random()+boost;

  if(!mega&&rnd()<.5){const r=normal[9]||normal[5];if(r){const cs=roomCells(r,0).filter(([x,y])=>tileAt(x,y-1)===WALL&&tileAt(x-1,y-1)===WALL&&tileAt(x+1,y-1)===WALL&&!props.some(p=>Math.abs(p.x-(x*T+8))<20&&Math.abs(p.y-(y*T+8))<20));if(cs.length){const [x,y]=cs[Math.floor(rnd()*cs.length)];addProp({type:'crack',x:x*T+8,y:y*T+3,r:5,solid:false,hp:30});}}}

// ---- damage & combat ----
function txt(x,y,s,col,big,force){if(!CFG.nums&&!force)return;texts.push({x:x+R(-3,3),y:y-10,s:String(s),col,big,t:0});}
function burst(x,y,n,cols,sp,up){for(let i=0;i<n;i++){const a=R(0,6.283),v=R(.4,1)*(sp||60);parts.push({x,y,z:up==null?6:up,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.7,vz:R(20,70),t:0,life:R(.3,.7),col:pick(cols),s:Math.random()<.3?2:1});}}
function addShake(v){if(CFG.shake)shake=Math.max(shake,v);}
function heal(v){if(!pl||pl.dead)return;pl.hp=Math.min(pl.maxHp,pl.hp+v);}
function hurt(e,amt,o){
  if(e.dead)return;o=o||{};
  if((e.hackT||0)>time)amt*=1.1+.05*rk('malware');if((e.hexT||0)>time)amt*=1+(e.hexV||.2);if(rk('exec')&&e.hp<e.max*.4)amt*=1+.15*rk('exec');
  if(rk('unstable')&&Math.random()<.05*rk('unstable')&&!e.d.boss)o.stun=Math.max(o.stun||0,.5);
  const crit=o.crit||pl.cloak>0||Math.random()*100<st.crit+(o.critB||0);
  const d=Math.max(1,Math.round(amt*(1+st.dmg/100)*(crit?1.8+st.critD/100:1)));
  txt(e.x,e.y-e.r,d,crit?'#ffd23a':'#e8f0ff',crit);
  if(st.ls>0)heal(d*Math.min(st.ls,12)/200);
  sfx('hit');
  applyDamage(e,d,o.kb,o.stun||0);
  if(hasMod('static')&&!o.noProc){pl.hitN++;if(pl.hitN%6===0){let n=0;for(const o2 of en){if(o2===e||o2.dead||n>=3)continue;if(dist(o2,e)<70){n++;fx.push({k:'zap',a:{x:e.x,y:e.y},b:{x:o2.x,y:o2.y},t:0,life:.14,col:'#40e0ff'});hurt(o2,12,{noProc:true});}}}}
}
// authority: solo/host apply directly; guests predict locally and tell the host
function applyDamage(e,d,kb,stun,fromNet){
  if(e.dead)return;
  e.hitT=.09;if(e.state==='idle'){e.state='chase';alertNear(e);}
  if(NET.guest&&!fromNet){e.hp=Math.max(1,e.hp-d);e.lastHit=time;netHit(e,d,kb,stun);return;}
  e.hp-=d;
  if(kb&&!e.d.boss){const m=e.type==='bruiser'?.25:1;e.vx+=kb.x*m;e.vy+=kb.y*m;}
  if(stun&&!e.d.boss)e.stun=Math.max(e.stun,stun);
  if(e.hp<=0)killEnemy(e);
}
function hurtProp(p,d){if(p.dead||p.hp==null)return;p.hp-=d;p.hitT=.09;if(p.hp<=0)breakProp(p);}
function alertNear(e){for(const o of en)if(o.state==='idle'&&dist(o,e)<150)o.state='chase';}
function boom(x,y,r,dmg,opts){
  opts=opts||{};
  fx.push({k:'ring',x,y,r,t:0,life:.3,col:opts.col||'#ff8a2a'});burst(x,y,opts.small?10:24,opts.cols||['#ff8a2a','#ffd23a','#ff2a3a','#2a1a1a'],opts.small?60:110);
  addShake(opts.small?2:6);sfx('boom');
  for(const e of en)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r){const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy)||1;hurt(e,dmg,{kb:{x:dx/d*140,y:dy/d*140},noProc:true});}
  for(const p of props)if(!p.dead&&p.hp!=null&&Math.hypot(p.x-x,p.y-y)<r+6)hurtProp(p,dmg);
  if(opts.hurtsPlayer&&Math.hypot(pl.x-x,pl.y-y)<r+pl.r)hitPlayer(Math.round(dmg*.6));
  addDecal(g=>{g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y,r*.6,r*.4,0,0,7);g.fill();});
}
function hitPlayer(d,src){
  if(pl.ifr>0||pl.dead)return;
  if(hasMod('ghost')&&Math.random()<.15){txt(pl.x,pl.y,'MISS','#b0b8ff',false,true);pl.ifr=.2;return;}
  d=Math.max(1,Math.round(d*(1-st.arm/100)*(pl.fortT>0?.5:1)));
  if(pl.fortT>0){const r=nearestEnemy(pl.x,pl.y,60);if(r)hurt(r,d*2,{noProc:true});}
  pl.hp-=d;pl.ifr=.35;addShake(4);hurtFlash=.35;sfx('hurt');txt(pl.x,pl.y-8,d,'#ff3a4a',false,true);
  burst(pl.x,pl.y,6,['#ff2a3a','#5a0a12'],60);
  addDecal(g=>{g.fillStyle='rgba(120,10,20,.4)';g.fillRect(pl.x+R(-4,4),pl.y+R(0,4),2,2);});
  if(hasMod('ward')&&pl.wardCd<=0){pl.wardCd=3;fx.push({k:'ring',x:pl.x,y:pl.y,r:44,t:0,life:.3,col:'#40e0ff'});for(const e of en)if(!e.dead&&dist(e,pl)<44+e.r){const dx=e.x-pl.x,dy=e.y-pl.y,dd=Math.hypot(dx,dy)||1;hurt(e,20,{kb:{x:dx/dd*160,y:dy/dd*160},noProc:true});}}
  if(src&&src.affx&&src.affx.includes('vamp')&&!src.dead){src.hp=Math.min(src.max,src.hp+d*1.5);burst(src.x,src.y-8,4,['#c02a4a'],40);}
  if(pl.hp<=0){pl.hp=0;pl.dead=true;burst(pl.x,pl.y,40,['#ff2a3a','#ffffff','#5a0a12'],120);addShake(10);
    if(partyHere().length){pl.down=true;banner('DOWN','A teammate can stand over you to pull you up',2600);}
    else{modal='dying';setTimeout(showDead,900);}}

// ============ play: player actions, enemy AI, boss, per-frame update ============
function lob(tx,ty,o){lobs.push(Object.assign({sx:pl.x,sy:pl.y,tx,ty,t:0},o));}
function autoTarget(x,y,maxD){
  let b=null,bd=maxD;
  for(const e of en){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd&&los(x,y,e.x,e.y)){bd=d;b=e;}}
  for(const p of props){if(p.dead||p.type!=='turret')continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd&&los(x,y,p.x,p.y)){bd=d;b=p;}}
  if(b)return b;bd=Math.min(maxD,120);
  for(const p of props){if(p.dead||p.hp==null||p.type==='turret'||p.type==='crack')continue;const d=Math.hypot(p.x-x,p.y-y);if(p.type==='barrel'&&d<50)continue;if(d<bd&&los(x,y,p.x,p.y)){bd=d;b=p;}}
  return b;
}
const DASH_STA=28;
function useEn(c){if(pl.en<c){toastOnce('Not enough energy. It refills over time.');return false;}pl.en-=c;return true;}
function nearestEnemy(x,y,maxD){let b=null,bd=maxD;for(const e of en){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd&&los(x,y,e.x,e.y)){bd=d;b=e;}}return b;}
function aimClamp(maxD){const dx=pl.aimPt.x-pl.x,dy=pl.aimPt.y-pl.y,l=Math.hypot(dx,dy)||1,d=Math.min(l,maxD);let tx=pl.x+dx/l*d,ty=pl.y+dy/l*d;
  const n=Math.ceil(d/6);for(let i=1;i<=n;i++){const x=pl.x+dx/l*d*i/n,y=pl.y+dy/l*d*i/n;if(solidAt(x,y)){tx=pl.x+dx/l*d*(i-1)/n;ty=pl.y+dy/l*d*(i-1)/n;break;}}
  return {x:tx,y:ty};}
function atkSpeed(){return 1+st.as/100;}
function cdMult(){return 1-st.cdr/100;}
const BULLET_COL='#ffd27a';
function shoot(x,y,a,o){pproj.push(Object.assign({x,y,vx:Math.cos(a)*o.spd,vy:Math.sin(a)*o.spd,r:3,life:.8,hit:new Set()},o));}
function slashAt(cx,cy,a,w,rng,dmg,kbk,bleed){let n=0;
  for(const e of en){if(e.dead)continue;const dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy)||1;if(d>rng+e.r)continue;let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)>w/2&&d>e.r+6)continue;
    n++;hurt(e,dmg,{kb:{x:dx/d*kbk,y:dy/d*kbk}});if(bleed&&!e.dead)e.dot={t:2,tick:.5,dps:bleed,col:'#ff2a3a'};}
  for(const p of props){if(p.dead||p.hp==null)continue;if(Math.hypot(p.x-cx,p.y-cy)<rng+(p.type==='turret'?10:6))hurtProp(p,dmg);}
  return n;
}
function primary(){
  const a=Math.atan2(pl.aim.y,pl.aim.x),c=pl.cls;
  if(KIT[c]&&KIT[c].P){KIT[c].P(a);return;}

    sfx(third?'slash3':'slash');slashAt(pl.x,pl.y-4,a,w,rng,dmg,third?160:60,2*rk('bleed'));
    pl.vx=(pl.vx||0)+pl.aim.x*40;pl.vy=(pl.vy||0)+pl.aim.y*40;
    pl.mxP=pl.cdP=(third?.45:.3)/atkSpeed();netAtk(third?'slash3':'slash',a);
  }else if(c==='chemdog'){
    const t=aimClamp(110),d=Math.hypot(t.x-pl.x,t.y-pl.y);
    lob(t.x,t.y,{dur:.25+d/420,kind:'acid',dmg:7+3.5*rk('bomb'),rad:17});

  }else if(c==='gunslinger'){
    const sp=R(-.05,.05);shoot(pl.x+Math.cos(a)*6,pl.y-6+Math.sin(a)*6,a+sp,{spd:300,kind:'bullet',dmg:(5+3*rk('revolver'))*(1+.12*rk('hollow')),ric:rk('ricochet'),life:.75});

  }else if(c==='adept'){
    shoot(pl.x+Math.cos(a)*6,pl.y-8+Math.sin(a)*6,a,{spd:220,kind:'bolt',dmg:7+3*rk('arc'),chain:1+Math.floor(rk('arc')/2),life:.9,r:4});
    sfx('zap');pl.mxP=pl.cdP=.42/atkSpeed();netAtk('bolt',a);
  }

  }
}
function skillQ(){

let lastToast='';function toastOnce(t){if(lastToast===t)return;lastToast=t;toast(t,'#ffd23a');setTimeout(()=>{if(lastToast===t)lastToast='';},3000);}
function doDash(){

  pl.dash={vx,vy,t:.16};pl.ifr=Math.max(pl.ifr,.24);

function landed(g){

    for(const e of en)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<g.rad+e.r)hurt(e,g.dmg);
    for(const p of props)if(!p.dead&&p.hp!=null&&Math.hypot(p.x-x,p.y-y)<g.rad+6)hurtProp(p,g.dmg);
    const c=rk('corrosive');pools.push({x,y,r:13*(1+.1*c),t:0,life:2.2,dps:(2+1.4*rk('bomb'))*(1+.2*c),tick:0,kind:'acid',mine:true});return;
  }

  if(g.kind==='bomblet'){boom(x,y,g.rad,cos?0:g.dmg,{small:true});return;}
  if(g.kind==='flash'){fx.push({k:'ring',x,y,r:g.rad,t:0,life:.25,col:'#ffffff'});fx.push({k:'flash',x,y,t:0,life:.25});burst(x,y,20,['#ffffff','#fff1a8'],140);sfx('boom');addShake(3);
    if(!cos)for(const e of en)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<g.rad+e.r)hurt(e,g.dmg,{stun:g.stun});return;}
  if(g.kind==='meteor'){boom(x,y,g.rad,cos?0:g.dmg,{cols:['#ff6a1a','#ffd23a','#ff2a3a','#2a1a1a']});pools.push({x,y,r:26,t:0,life:3,dps:cos?0:6+3*rk('meteor'),tick:0,kind:'fire',mine:true,cos});return;}

// ---- enemy AI ----
function efire(x,y,a,spd,dmg,col,r){spd*=1.12+.025*(run?run.floor:0);eproj.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:r||3,dmg,life:3,col:col||'#ff3a4a'});netEv(['p',Math.round(x),Math.round(y),Math.round(Math.cos(a)*spd),Math.round(Math.sin(a)*spd),dmg,col||'#ff3a4a',r||3]);}
function addMark(m){marks.push(m);netEv(['mk',m.k,Math.round(m.x),Math.round(m.y),m.r||0,+(m.a||0).toFixed(3),m.len||0,m.w||0,m.warn,m.dmg||0,+(m.t||0).toFixed(2)]);}
function targets(){const a=[];if(!pl.dead&&!(pl.cloak>0))a.push(pl);for(const p of partyHere())if(!p.dead)a.push(p);return a;}
function nearestTarget(x,y){let b=null,bd=1e9;for(const t of targets()){const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;b=t;}}return b;}
function enemyUpdate(e,dt){
  e.hitT-=dt;e.atkCd-=dt;e.myCd=(e.myCd||0)-dt;if(e.stun>0)e.stun-=dt;if(e.frozen>0)e.frozen-=dt;
  if(e.dot){const D=e.dot;D.t-=dt;D.tick-=dt;if(D.tick<=0){D.tick=.5;const d=Math.max(1,Math.round(D.dps*.5*(1+st.dmg/100)));txt(e.x,e.y-e.r,d,D.col);applyDamage(e,d);if(e.dead)return;}if(D.t<=0)e.dot=null;}
  // contact damage is checked by every client against its own player
  const pd=Math.hypot(pl.x-e.x,pl.y-e.y);
  if(NET.guest){
    if(e.tx!=null){const k=Math.min(1,dt*14);e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;}
    if(!pl.dead&&e.d.ai!=='spit'&&e.d.ai!=='gun'&&e.d.ai!=='rifle'&&e.d.ai!=='drone'&&pd<e.r+pl.r+6&&e.myCd<=0&&e.stun<=0){e.myCd=.9;hitPlayer(e.dmg,e);}
    return;
  }
  const kd=Math.max(0,1-dt*8);e.vx*=kd;e.vy*=kd;
  if(Math.abs(e.vx)+Math.abs(e.vy)>1)moveEnt(e,e.vx*dt,e.vy*dt);
  const tg=nearestTarget(e.x,e.y);if(!tg){e.state='idle';return;}
  const dx=tg.x-e.x,dy=tg.y-e.y,d=Math.hypot(dx,dy)||1,see=d<210&&los(e.x,e.y,tg.x,tg.y);
  if(e.state==='idle'){
    if(see&&d<210){e.state='chase';alertNear(e);}
    else{e.wob+=dt;if(Math.sin(e.wob*.7)>.6){const a=e.wob*1.3;moveEnt(e,Math.cos(a)*e.spd*.25*dt,Math.sin(a)*e.spd*.25*dt);}return;}
  }
  e.face=dx>=0?1:-1;
  if(e.stun>0)return;
  if(e.affx&&e.affx.includes('tele')){e.tpT=(e.tpT||R(2,4))-dt;if(e.tpT<=0&&see&&d>50){e.tpT=R(3.5,5);burst(e.x,e.y-6,10,['#c05aff'],60);const a2=R(0,6.28),nx=tg.x+Math.cos(a2)*34,ny=tg.y+Math.sin(a2)*34;if(!circleHitsWall(nx,ny,e.r)){e.x=nx;e.y=ny;burst(e.x,e.y-6,10,['#c05aff'],60);}}}
  if(e.pull&&e.pull.t>0){e.pull.t-=dt;const px=e.pull.x-e.x,py=e.pull.y-e.y,pd2=Math.hypot(px,py);if(pd2>4&&!e.d.boss)moveEnt(e,px/pd2*Math.min(pd2,(e.pull.s||110)*dt),py/pd2*Math.min(pd2,(e.pull.s||110)*dt));}
  const ai=e.d.ai,slow=(tileAt(Math.floor(e.x/T),Math.floor(e.y/T))===WATER&&!e.d.fly?.65:1)*((e.slowT||0)>time?.65:1);
  let mx=0,my=0,sp=e.spd*slow;
  const toward=()=>{if(see){if(d<e.r+(tg.r||5)+1&&ai!=='spit'&&ai!=='gun'&&ai!=='rifle'&&ai!=='drone')return;mx=dx/d;my=dy/d;if(d>36&&e.type!=='rat'){const fl=(e.id%2?1:-1)*.45;const tx=mx-my*fl,ty=my+mx*fl,l=Math.hypot(tx,ty)||1;mx=tx/l;my=ty/l;}}else{const f=flowDir(e);if(f){mx=f.x;my=f.y;}}};
  if(ai==='melee'){toward();if(e.type==='rat'){e.wob+=dt*8;const w=Math.sin(e.wob)*.5;const tx=mx-my*w,ty=my+mx*w;mx=tx;my=ty;}}
  else if(ai==='lunge'){
    if(e.dashT>0){e.dashT-=dt;mx=e.ldx;my=e.ldy;sp=210;}
    else if(e.tele>0){e.tele-=dt;sp=0;if(e.tele<=0){e.dashT=.28;e.ldx=dx/d;e.ldy=dy/d;}}
    else{toward();e.spT-=dt;if(see&&d<70&&d>20&&e.spT<=0){e.tele=.35;e.spT=R(2.2,3.5);}}
  }else if(ai==='spit'||ai==='gun'||ai==='rifle'||ai==='drone'){
    const near=ai==='drone'?70:ai==='spit'?60:70,far=ai==='rifle'?150:ai==='drone'?120:110;
    if(!see||d>far)toward();else if(d<near){mx=-dx/d;my=-dy/d;}else{e.wob+=dt;const s=Math.sin(e.wob*.8)>0?1:-1;mx=-dy/d*s;my=dx/d*s;sp*=.6;}
    e.shotT-=dt;
    if(see&&d<180&&e.shotT<=0){
      const a=Math.atan2(dy,dx);
      if(ai==='spit'){e.shotT=R(2,2.8)*.8;for(const o of [-.25,0,.25])efire(e.x,e.y,a+o,75,e.dmg,'#9aff3a',3);}
      else if(ai==='gun'){e.shotT=R(1.8,2.4)*.8;e.burst=3;e.burstT=0;}
      else if(ai==='rifle'){e.shotT=R(2.4,3)*.8;e.burst=5;e.burstT=0;}
      else{e.shotT=R(1.1,1.6)*.8;efire(e.x,e.y-6,a,150,e.dmg,'#ff2a4a',2);sfx('laser');}
    }
    if(e.burst>0){e.burstT-=dt;if(e.burstT<=0){e.burst--;e.burstT=ai==='rifle'?.09:.13;const a=Math.atan2(dy,dx)+R(-.12,.12);efire(e.x,e.y-4,a,ai==='rifle'?170:140,e.dmg,ai==='rifle'?'#40e0ff':'#ffd23a',2);if(e.affx&&e.affx.includes('multi')){efire(e.x,e.y-4,a-.3,140,e.dmg,'#ffd23a',2);efire(e.x,e.y-4,a+.3,140,e.dmg,'#ffd23a',2);}sfx('shot');}}
  }else if(ai==='charge'){
    if(e.dashT>0){e.dashT-=dt;const bx=e.x,by=e.y;moveEnt(e,e.ldx*230*dt,e.ldy*230*dt);if(Math.hypot(e.x-bx,e.y-by)<230*dt*.5){e.dashT=0;e.stun=.9;addShake(4);sfx('boom');burst(e.x,e.y,12,['#8a8a8a','#5a4a3a'],80);}
      if(!pl.dead&&pd<e.r+pl.r+7&&e.atkCd<=0){e.atkCd=.8;hitPlayer(e.dmg,e);pl.vx=(pl.vx||0)+e.ldx*260;pl.vy=(pl.vy||0)+e.ldy*260;}return;}
    else if(e.tele>0){e.tele-=dt;sp=0;if(e.tele<=0)e.dashT=.65;}
    else{toward();e.spT-=dt;if(see&&d<130&&e.spT<=0){e.tele=.75;e.spT=R(3.5,5);e.ldx=dx/d;e.ldy=dy/d;addMark({k:'line',x:e.x,y:e.y,a:Math.atan2(dy,dx),len:150,w:e.r*2,t:0,warn:.75,dmg:0});}}
  }else if(ai==='boss'){bossAI(e,dt,d,dx,dy,tg);return;}
  if(mx||my)moveEnt(e,mx*sp*dt,my*sp*dt);
  if(ai!=='spit'&&ai!=='gun'&&ai!=='rifle'&&ai!=='drone'&&!pl.dead&&pd<e.r+pl.r+6&&e.atkCd<=0){e.atkCd=.72;hitPlayer(e.dmg,e);}
}
function bossAI(e,dt,d,dx,dy,tg){
  if(e.phase===1&&e.hp<e.max*.5){e.phase=2;e.spd*=1.25;}
  const p2=e.phase===2,a=Math.atan2(dy,dx),pd=Math.hypot(pl.x-e.x,pl.y-e.y);
  // dashes (lunge / charge)
  if(e.dashT>0){e.dashT-=dt;const bx=e.x,by=e.y;moveEnt(e,e.ldx*e.dashV*dt,e.ldy*e.dashV*dt);if(Math.hypot(e.x-bx,e.y-by)<e.dashV*dt*.4){e.dashT=0;addShake(5);sfx('boom');burst(e.x,e.y,14,['#8a8a8a','#5a4a3a'],90);}
    if(!pl.dead&&pd<e.r+pl.r+6&&e.atkCd<=0){e.atkCd=.8;hitPlayer(e.dmg,e);pl.vx=(pl.vx||0)+e.ldx*300;pl.vy=(pl.vy||0)+e.ldy*300;}return;}
  if(e.tele>0){e.tele-=dt;if(e.tele<=0){e.dashT=e.dashDur;sfx('dash');}return;}
  const keep=e.type==='brood'?60:e.type==='razor'?40:70;
  if(e.cast<=0&&d>keep)moveEnt(e,dx/d*e.spd*dt,dy/d*e.spd*dt);
  if(e.cast>0)e.cast-=dt;
  if(e.gat>0){e.gat-=dt;e.gatT=(e.gatT||0)-dt;if(e.gatT<=0){e.gatT=p2?.05:.07;e.gatA=(e.gatA||0)+dt*3;efire(e.x+(Math.random()<.5?-12:12),e.y-14,a+Math.sin(e.gatA*4)*.35,150,e.dmg*.5|0,'#ffd23a',2);sfx('shot');}}
  if(e.ringN>0){e.ringT-=dt;if(e.ringT<=0){e.ringN--;e.ringT=.35;const n=e.type==='brood'?(p2?18:14):(p2?26:18),off=R(0,1),sp=e.type==='brood'?70:90,col=e.type==='brood'?'#9aff3a':'#ff2a3a';for(let i=0;i<n;i++)efire(e.x,e.y-10,off+i/n*Math.PI*2,sp,e.dmg*.6|0,col,3);sfx('zap');}}
  if(e.spitN>0){e.spitT-=dt;if(e.spitT<=0){e.spitN--;e.spitT=.45;for(let k=-2;k<=2;k++)efire(e.x,e.y-12,a+k*.22,95,e.dmg*.6|0,'#9aff3a',3);sfx('flask');}}
  if(e.sgN>0){e.sgT-=dt;if(e.sgT<=0){e.sgN--;e.sgT=.55;for(let k=0;k<8;k++)efire(e.x,e.y-10,a-.45+.9*k/7+R(-.05,.05),R(150,175),e.dmg*.45|0,'#ffb02e',2);sfx('shot');sfx('boom');addShake(2);}}
  if(!pl.dead&&pd<e.r+pl.r+8&&e.atkCd<=0){e.atkCd=1.2;hitPlayer(e.dmg,e);pl.vx=(pl.vx||0)+(pl.x-e.x)/pd*280;pl.vy=(pl.vy||0)+(pl.y-e.y)/pd*280;fx.push({k:'ring',x:e.x,y:e.y,r:40,t:0,life:.3,col:'#ff2a3a'});addShake(6);}
  e.patT-=dt;if(e.patT>0)return;
  const seq=(p2?e.d.pats2:e.d.pats)||['gat'];
  const pat=seq[e.pat++%seq.length];
  if(pat==='gat'){e.gat=p2?2.4:2;e.cast=.5;}
  if(pat==='ring'||pat==='acidring'){e.ringN=p2?4:3;e.ringT=0;e.cast=1.2;}
  if(pat==='spit'){e.spitN=p2?5:3;e.spitT=0;e.cast=.8;}
  if(pat==='shotgun'){e.sgN=p2?4:3;e.sgT=.2;e.cast=1;}
  if(pat==='lunge'||pat==='charge'){e.ldx=dx/d;e.ldy=dy/d;e.tele=pat==='lunge'?.6:.75;e.dashV=pat==='lunge'?240:280;e.dashDur=pat==='lunge'?.4:.65;addMark({k:'line',x:e.x,y:e.y,a,len:e.dashV*e.dashDur,w:e.r*2,t:0,warn:e.tele,dmg:0});}
  if(pat==='missiles'||pat==='grenades'){const ts=targets();const n=pat==='grenades'?(p2?6:4):(p2?9:6);for(let i=0;i<n;i++){const t=ts[i%ts.length]||tg;const tx=t.x+(i<ts.length?0:R(-70,70)),ty=t.y+(i<ts.length?0:R(-50,50));if(!solidAt(tx,ty))addMark({k:'circle',x:tx,y:ty,r:22,t:-i*.12,warn:1.1,dmg:e.dmg});}e.cast=.8;sfx('laser');}
  if(pat==='drones'){const alive=en.filter(o=>!o.dead&&o.type==='drone').length;for(let i=0;i<Math.min(2,4-alive);i++){const o=spawnEnemy('drone',e.x+R(-30,30),e.y+R(-10,20));o.state='chase';if(NET.host){o.hp*=run.pm||1;o.max*=run.pm||1;}burst(o.x,o.y,10,['#40e0ff','#ffffff'],60);}e.cast=.6;}
  if(pat==='brood'){const alive=en.filter(o=>!o.dead&&o.type==='rat').length;for(let i=0;i<Math.min(p2?5:4,12-alive);i++){const o=spawnEnemy('rat',e.x+R(-24,24),e.y+R(-8,16));o.state='chase';if(NET.host){o.hp*=run.pm||1;o.max*=run.pm||1;}burst(o.x,o.y,8,['#9aff3a','#3a5a40'],50);}sfx('huff');e.cast=.7;}
  e.patT=(p2?1.9:2.6)*(e.type==='warden'?1:1.15);
}
// ---- props per frame ----
function propUpdate(p,dt){
  if(p.hitT>0)p.hitT-=dt;
  if(p.type==='plate'){p.phase+=dt;const c=p.phase%3.6;p.state=c<2.2?'off':c<2.8?'warn':'on';
    if(p.state==='on'){p.tick=(p.tick||0)-dt;if(p.tick<=0){p.tick=.35;if(!pl.dead&&Math.abs(pl.x-p.x)<9&&Math.abs(pl.y-p.y)<9)hitPlayer(8+4*run.floor);for(const e of en)if(!e.dead&&Math.abs(e.x-p.x)<9&&Math.abs(e.y-p.y)<9)hurt(e,10,{noProc:true});}}}
  else if(p.type==='turret'&&!p.dead){const d=dist(p,pl);p.shotT-=dt;if(d<170&&!pl.dead&&!(pl.cloak>0)&&los(p.x,p.y+8,pl.x,pl.y)){p.aim=Math.atan2(pl.y-p.y,pl.x-p.x);if(p.shotT<=0){p.shotT=1.6;p.burst=3;p.bT=0;}}
    if(p.burst>0){p.bT-=dt;if(p.bT<=0){p.burst--;p.bT=.12;eproj.push({x:p.x,y:p.y+4,vx:Math.cos(p.aim+R(-.08,.08))*150,vy:Math.sin(p.aim+R(-.08,.08))*150,r:2,dmg:6+3*run.floor,life:3,col:'#ff2a3a'});sfx('laser');}}}
}

// ---- main dungeon/town update ----
function update(dt,inputOn){
  refreshStats();
  const ok=!pl.dead&&inputOn!==false;
  const kx=ok?(key.KeyD||key.ArrowRight?1:0)-(key.KeyA||key.ArrowLeft?1:0):0,ky=ok?(key.KeyS||key.ArrowDown?1:0)-(key.KeyW||key.ArrowUp?1:0):0;
  let mvx=0,mvy=0;if(kx||ky){const l=Math.hypot(kx,ky);mvx=kx/l;mvy=ky/l;}
  pl.mvx=mvx;pl.mvy=mvy;pl.moving=!!(mvx||mvy);
  if(ok){
    let m={x:mouse.x+cam.x-W/2,y:mouse.y+cam.y-H/2};
    if(CFG.autoAim&&scene==='dungeon'){const t=autoTarget(pl.x,pl.y,180);if(t)m={x:t.x,y:t.y-6};}
    pl.aimPt=m;const ax=m.x-pl.x,ay=m.y-(pl.y-6),al=Math.hypot(ax,ay)||1;pl.aim={x:ax/al,y:ay/al};if(Math.abs(ax)>2)pl.face=ax>=0?1:-1;
  }
  pl.ifr-=dt;pl.cdP-=dt;pl.cdR-=dt;pl.cdQ-=dt;pl.cdD-=dt;pl.comboT-=dt;pl.wardCd-=dt;
  if(pl.frenzy>0){pl.frenzy-=dt;if(Math.random()<.5)parts.push({x:pl.x+R(-4,4),y:pl.y,z:R(4,16),vx:0,vy:0,vz:R(10,30),t:0,life:.5,col:'#7aff5a',s:1});}
  if(pl.over>0){pl.over-=dt;if(Math.random()<.4)parts.push({x:pl.x+R(-4,4),y:pl.y,z:R(6,16),vx:0,vy:0,vz:R(10,30),t:0,life:.4,col:'#40e0ff',s:1});}
  const water=tileAt(Math.floor(pl.x/T),Math.floor(pl.y/T))===WATER&&scene==='dungeon';
  // stamina: sprint with shift, dash costs a chunk; energy powers skills
  pl.sprint=ok&&pl.moving&&!pl.winded&&(key.ShiftLeft||key.ShiftRight)&&pl.sta>0;
  if(pl.sprint){pl.sta-=24*dt;pl.staT=.5;if(pl.sta<=0){pl.sta=0;pl.winded=true;toastOnce('Out of breath');}if(Math.random()<.35)parts.push({x:pl.x+R(-3,3),y:pl.y+2,z:0,vx:-pl.mvx*20,vy:-pl.mvy*20,vz:R(5,15),t:0,life:.3,col:'#6a6070',s:1});}
  else{pl.staT-=dt;if(pl.staT<=0)pl.sta=Math.min(pl.maxSta,pl.sta+38*(1+st.stR/100)*dt);}
  if(pl.winded&&pl.sta>=pl.maxSta*.35)pl.winded=false;pl.maxSta=100+(st.sta||0);
  pl.en=Math.min(pl.maxEn,pl.en+9*(1+st.enR/100)*(1+st.cdr/200)*dt);
  const sp=CLASSES[pl.cls].spd*(1+st.ms/100)*(water?.75:1)*(pl.sprint?1.55:1)*(pl.suppT>0?.55:1);
  if(pl.dash){const d=pl.dash;d.t-=dt;moveEnt(pl,d.vx*(d.spd||260)*dt,d.vy*(d.spd||260)*dt);parts.push({x:pl.x,y:pl.y,z:8,vx:0,vy:0,vz:0,t:0,life:.22,col:d.col||CLASSES[pl.cls].col,s:2});
    if(d.hit){for(const e of en){if(e.dead||d.hit.has(e)||Math.hypot(e.x-pl.x,e.y-pl.y)>e.r+pl.r+8)continue;d.hit.add(e);hurt(e,d.dmg,{kb:{x:d.vx*(d.kb||80),y:d.vy*(d.kb||80)},stun:d.stun||0});burst(e.x,e.y-6,6,[d.col||'#fff','#ffffff'],60);}for(const p of props)if(!p.dead&&p.hp!=null&&Math.hypot(p.x-pl.x,p.y-pl.y)<14)hurtProp(p,d.dmg);}
    if(d.t<=0)pl.dash=null;}
  else if(ok)moveEnt(pl,mvx*sp*dt,mvy*sp*dt);

// movement skills that ride on SPACE (using stamina) when unlocked
const DASHSK={spectre:['1','step'],riftwitch:['Q','warp'],flarecaster:['1','lunge'],samurai:['1','iai'],bulwark:['RMB','bash']};
function spaceSkill(){
  const m=DASHSK[pl.cls];if(!m||!rk(m[1]))return false;
  const [slot]=m,a=Math.atan2(pl.aim.y,pl.aim.x);pl.cds=pl.cds||{};pl.mxs=pl.mxs||{};
  const ready=slot==='1'?(pl.cds[1]||0)<=0:slot==='Q'?pl.cdQ<=0:pl.cdR<=0;if(!ready)return false;
  if(pl.sta<DASH_STA+6){toastOnce('Not enough stamina');return true;}
  const k=KIT[pl.cls];let r;
  if(slot==='1'){r=k.K1(a);if(r===false||r==null)return false;pl.cds[1]=pl.mxs[1]=r*cdMult();}
  else if(slot==='Q'){if(k.Q(a)===false)return false;}else{if(k.R(a)===false)return false;}
  pl.sta-=DASH_STA+6;pl.staT=.7;return true;
}
// auto-cast: fires ready skills at the nearest enemy (Death Must Die style)

  const save={aim:pl.aim,pt:pl.aimPt},dx=t.x-pl.x,dy=t.y-6-(pl.y-6),l=Math.hypot(dx,dy)||1;pl.aim={x:dx/l,y:dy/l};pl.aimPt={x:t.x,y:t.y};
  const mv=DASHSK[pl.cls]||[],sk=SKILLS[pl.cls],ok=s=>s&&rk(s.id)&&s.id!==mv[1];let did=false;
  if(!did&&pl.cdR<=0&&ok(sk[1])&&pl.en>=ECOST.R+10){if(useEn(ECOST.R)){skillR();did=true;}}
  if(!did&&pl.cdQ<=0&&ok(sk[2])&&pl.en>=ECOST.Q+10){if(useEn(ECOST.Q)){skillQ();did=true;}}
  for(const n of [1,2]){if(did)break;const s=sk.find(x=>x.slot===String(n));if(ok(s)&&(pl.cds&&pl.cds[n]||0)<=0&&pl.en>=(n===1?ECOST.K1:ECOST.K2)+10){hotSkill(n);did=true;}}
  if(!did&&(pl.cds&&pl.cds[3]||0)<=0&&pl.en>=HOT.grenade.cost+40&&l>50){hotSkill(3);did=true;}

// per-frame timers for kit effects
function kitUpdate(dt){
  for(const k of ['cloak','suppT','fortT','ovcT','ovwT','eclT','odT','trailT','regenT','stormT','cutsT'])if(pl[k]>0)pl[k]-=dt;
  pl.cds=pl.cds||{};for(const n in pl.cds)pl.cds[n]-=dt;
  const a=Math.atan2(pl.aim.y,pl.aim.x);
  if(pl.suppT>0&&!pl.dead){pl.suppF-=dt;if(pl.suppF<=0){pl.suppF=.065;shoot(pl.x+Math.cos(a)*7,pl.y-6+Math.sin(a)*7,a+R(-.13,.13),{spd:300,kind:'bullet',dmg:4+2*rk('supp'),life:.6});sfx('shot');if(Math.random()<.3)netAtk('shot',a);}}

  if(pl.regenT>0&&!pl.dead)heal(pl.maxHp*.02*dt);
  if(pl.stormT>0&&!pl.dead){pl.stormF-=dt;if(pl.stormF<=0){pl.stormF=.4;const c=en.filter(e=>!e.dead&&dist(e,pl)<120);if(c.length){const e=pick(c);fx.push({k:'zap',a:{x:e.x+R(-6,6),y:e.y-90},b:{x:e.x,y:e.y},t:0,life:.18,col:'#40e0ff'});burst(e.x,e.y,8,['#40e0ff','#ffffff'],70);hurt(e,25+10*rk('storm'),{noProc:true});sfx('zap');}}}
  if(pl.cutsT>0&&!pl.dead){pl.cutsF-=dt;if(pl.cutsF<=0){pl.cutsF=.25;slashAt(pl.x,pl.y-4,0,7,34,8+3*rk('cuts'),40);fx.push({k:'spin',follow:true,r:34,t:0,life:.2,col:'#ff2a6a'});sfx('slash');}}
  // allies (turrets, drones, mines)
  const rate=pl.ovcT>0?2:1;

    if(o.k==='drone'){o.ang+=dt*2.4;const ow=o.owner||pl,tx=ow.x+Math.cos(o.ang)*20,ty=ow.y-4+Math.sin(o.ang)*12;o.x+=(tx-o.x)*Math.min(1,dt*8);o.y+=(ty-o.y)*Math.min(1,dt*8);}

    o.fireT-=dt*rate;if(o.fireT>0)continue;
    let b=null,bd=o.k==='drone'?80:160;for(const e of en){if(e.dead)continue;const d=Math.hypot(e.x-o.x,e.y-o.y);if(d<bd&&los(o.x,o.y,e.x,e.y)){bd=d;b=e;}}
    if(!b)continue;const aa=Math.atan2(b.y-6-(o.y-6),b.x-o.x);o.aim=aa;
    if(o.k==='turret'){o.fireT=.5;shoot(o.x,o.y-6,aa,{spd:300,kind:'bullet',dmg:o.dmg,life:.6,cos:o.cos,col:'#ffb02e'});sfx('shot');}
    else{o.fireT=.7;fx.push({k:'zap',a:{x:o.x,y:o.y},b:{x:b.x,y:b.y},t:0,life:.12,col:'#40e0ff'});if(!o.cos)hurt(b,o.dmg,{noProc:true});}
  }
  allies=allies.filter(o=>!o.dead);
}

let nbRun=false,nbCols=null;
function netBgStart(){if(nbRun)return;nbRun=true;requestAnimationFrame(netBgFrame);}
function netBgFrame(t){
  const c=$('netbg');if(modal!=='menu'||$('veil').hidden){nbRun=false;return;}
  const w=Math.ceil(innerWidth/3),h=Math.ceil(innerHeight/3);if(c.width!==w||c.height!==h){c.width=w;c.height=h;nbCols=null;}
  const g=c.getContext('2d'),fs=7,n=Math.ceil(w/fs);
  if(!nbCols){nbCols=Array.from({length:n},()=>({y:Math.random()*h,v:R(14,40),c:Math.random()<.18?'#ff2a9a':'#40e0ff'}));g.fillStyle='#04030a';g.fillRect(0,0,w,h);}
  g.fillStyle='rgba(4,3,10,.16)';g.fillRect(0,0,w,h);
  g.font=`${fs}px monospace`;const glyph='01アイウカキサシタチナニハヒマミヤラワ<>/{}#$%&ΣΔ';
  nbCols.forEach((col,i)=>{col.y+=col.v/60;if(col.y>h+20){col.y=-R(0,60);col.v=R(14,40);}g.fillStyle=col.c;g.globalAlpha=.55;g.fillText(glyph[Math.floor(Math.random()*glyph.length)],i*fs,col.y);g.globalAlpha=1;g.fillStyle='#ffffff';g.globalAlpha=.25;g.fillText(glyph[Math.floor(Math.random()*glyph.length)],i*fs,col.y+fs);g.globalAlpha=1;});
  // perspective grid floor
  const hz=h*.62,tt=(t/1000)%1;g.strokeStyle='rgba(255,42,154,.22)';g.lineWidth=1;
  for(let k=0;k<12;k++){const z=(k+tt)/12,y=hz+(h-hz)*z*z;g.beginPath();g.moveTo(0,y|0);g.lineTo(w,y|0);g.stroke();}
  for(let k=-12;k<=12;k++){g.beginPath();g.moveTo(w/2+k*6,hz);g.lineTo(w/2+k*w/8,h);g.stroke();}
  requestAnimationFrame(netBgFrame);
}

function netName(){return (CFG.name||'Runner').slice(0,16);}
const partyMult=n=>1+.75*(Math.max(1,n)-1);
// ---- relay servers (TURN) for networks that block direct connections ----
let iceCache=null;
async function getIce(){
  if(iceCache)return iceCache;
  const base=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.relay.metered.ca:80'}];
  if(UBC.meteredApp&&UBC.meteredKey){
    try{const r=await fetch(`https://${encodeURIComponent(UBC.meteredApp)}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(UBC.meteredKey)}`);
      if(r.ok){const list=await r.json();if(Array.isArray(list)&&list.length){iceCache=base.concat(list);NET.relay=true;return iceCache;}}}catch(e){}
  }
  return null; // fall back to PeerJS's built-in defaults
}
async function peerOpts(){const ice=await getIce();return Object.assign({debug:0},ice?{config:{iceServers:ice}}:{},window.UB_PEER_OPTS||{});}
function netReset(){
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{on:false,host:false,guest:false,peer:null,hostConn:null,fastConn:null,code:null,myId:'solo',rid:null,pending:null,hostLast:0,lastSeq:-1});
  NET.guests.clear();NET.players.clear();NET.ev=[];NET.hits.clear();
}
// ---- hosting ----
async function netHost(cb){
  if(!netReady())return cb('The multiplayer library did not load. Check your connection and reload.');
  netReset();const code=genCode(),opts=await peerOpts();
  let done=false;const fail=m=>{if(!done){done=true;netReset();cb(m);}};
  const peer=new Peer(ROOM_PREFIX+code,opts);NET.peer=peer;
  const to=setTimeout(()=>fail('Could not reach the matchmaking server. Check your internet, or use the hosted (Vercel) version.'),10000);
  peer.on('open',()=>{clearTimeout(to);if(done)return;done=true;Object.assign(NET,{on:true,host:true,code,myId:'h'});cb(null,code);});
  peer.on('connection',c=>{
    const id=c.peer,fast=c.label==='fast';
    c.on('open',()=>{let g=NET.guests.get(id);if(!g){g={main:null,fast:null,last:now(),dmg:0,dmgT:now(),ok:false};NET.guests.set(id,g);}if(fast)g.fast=c;else g.main=c;g.last=now();});
    c.on('data',m=>{const g=NET.guests.get(id);if(g)g.last=now();onHostData(id,m);});
    if(!fast){c.on('close',()=>dropGuest(id));c.on('error',()=>dropGuest(id));}
  });
  peer.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='unavailable-id'?'That room code is taken. Try again.':'Multiplayer could not start here. Use the hosted (Vercel) version.');}});
  peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect();}catch(e){}});
}
function sendTo(id,m,fast){const g=NET.guests.get(id);if(!g)return;const c=fast&&g.fast&&g.fast.open?g.fast:g.main;if(!c||!c.open)return;try{c.send(m);}catch(e){}}
function broadcast(m,except,fast){for(const id of NET.guests.keys())if(id!==except)sendTo(id,m,fast);}
function dropGuest(id,why){
  const g=NET.guests.get(id);if(!g)return;NET.guests.delete(id);
  try{g.main&&g.main.close();}catch(e){}try{g.fast&&g.fast.close();}catch(e){}
  const p=NET.players.get(id);NET.players.delete(id);if(p)toast(`${esc(p.name)} ${why||'left'}.`,'#ffd23a');
  broadcast({t:'gone',id});rescaleParty();
}
// ---- joining ----
async function netJoin(code,cb){
  if(!netReady())return cb('The multiplayer library did not load. Check your connection and reload.');
  netReset();code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5)return cb('Room codes are 5 letters and numbers.');
  const opts=await peerOpts();
  let done=false;const fail=m=>{if(!done){done=true;netReset();cb(m);}};
  const peer=new Peer(undefined,opts);NET.peer=peer;
  const to=setTimeout(()=>fail('No answer from that room. Check the code. If it is right, your network may be blocking the connection (see the README about relay servers).'),15000);
  peer.on('open',id=>{
    const c=peer.connect(ROOM_PREFIX+code,{reliable:true,label:'main'});
    c.on('open',()=>{clearTimeout(to);if(done)return;done=true;Object.assign(NET,{on:true,guest:true,hostConn:c,code,myId:id,hostLast:now()});
      c.send({t:'hello',name:netName(),cls:meta.cls,lvl:charData(meta.cls).lvl});
      const f=peer.connect(ROOM_PREFIX+code,{reliable:false,label:'fast'});f.on('open',()=>{NET.fastConn=f;});f.on('data',m=>{NET.hostLast=now();onGuestData(m);});
      cb(null);});
    c.on('data',m=>{NET.hostLast=now();onGuestData(m);});
    c.on('close',()=>hostLost());c.on('error',()=>hostLost());
  });
  peer.on('error',e=>{if(!done){clearTimeout(to);fail(e.type==='peer-unavailable'?'No room with that code. Check it with your host.':'Could not connect. Your network may be blocking it (see the README about relay servers).');}});
}
function netLeave(){if(!NET.on)return;netSend({t:'bye'});const p=NET.peer;setTimeout(()=>{if(NET.peer===p)netReset();},250);toast('You left the party.','#ffd23a');}
function hostLost(why){
  if(!NET.guest)return;netReset();toast(why||'Lost connection to the host. Your loot from this run is banked.','#ff3a4a');
  if(scene==='dungeon'&&run){closePanel();endRun('extract');}
  if(modal==='mp')showMultiplayer();
}
// ---- sending ----
function netSend(m,fast){
  if(!NET.on)return;
  if(NET.guest){const c=fast&&NET.fastConn&&NET.fastConn.open?NET.fastConn:NET.hostConn;try{if(c&&c.open)c.send(m);}catch(e){}}
  else{if(m.t==='rev'){if(m.to==='h')revive(.4);else sendTo(m.to,{t:'rev',to:m.to});return;}m.from='h';broadcast(m,null,fast);}
}
function netEv(v){if(NET.host&&NET.guests.size&&scene==='dungeon')NET.ev.push(v);}
function netAtk(k,a,tx,ty){if(!NET.on)return;netSend({t:'atk',k,a:+a.toFixed(2),tx:tx==null?0:Math.round(tx),ty:ty==null?0:Math.round(ty)});}
function netHit(e,d,kb,stun){const h=NET.hits.get(e.id)||[0,0,0,0];h[0]+=d;if(kb){h[1]=Math.round(kb.x);h[2]=Math.round(kb.y);}if(stun)h[3]=Math.max(h[3],+stun.toFixed(2));NET.hits.set(e.id,h);}
function netKill(e){if(!NET.host||!NET.guests.size)return;broadcast({t:'kill',rid:NET.rid,id:e.id,type:e.type,x:Math.round(e.x),y:Math.round(e.y),elite:e.elite?1:0,key:e.key?1:0});}
function myState(){return {t:'st',name:netName(),cls:pl.cls,x:Math.round(pl.x),y:Math.round(pl.y),f:pl.face,hp:Math.round(pl.hp),max:pl.maxHp,dead:pl.dead?1:0,sc:scene==='dungeon'?'d':scene==='town'?'t':'m',rid:scene==='dungeon'&&run?NET.rid:null,fl:run?run.floor:-1,lvl:pl.cd.lvl,mv:pl.moving?1:0,fz:pl.frenzy>0?1:0};}
// ---- party bookkeeping ----
function upsertPlayer(id,m){
  let p=NET.players.get(id);if(!p){p={id,x:num(m.x),y:num(m.y),revT:0};NET.players.set(id,p);toast(`${esc(String(m.name||'Someone').slice(0,16))} is here.`,'#40e0ff');}
  p.name=String(m.name||'Runner').slice(0,16);p.cls=CLASSES[m.cls]?m.cls:'samurai';p.tx=num(m.x);p.ty=num(m.y);p.face=m.f===-1?-1:1;p.hp=num(m.hp);p.max=Math.max(1,num(m.max));p.dead=!!m.dead;p.sc=m.sc;p.rid=m.rid;p.fl=num(m.fl);p.lvl=num(m.lvl)|0;p.mv=!!m.mv;p.fz=!!m.fz;p.seen=now();
  return p;
}
function partyHere(){const a=[],t=now();for(const p of NET.players.values()){if(t-(p.seen||0)>HB_TIMEOUT)continue;if(scene==='dungeon'?(p.sc==='d'&&p.rid===NET.rid&&run&&p.fl===run.floor):(scene==='town'&&p.sc==='t'))a.push(p);}return a;}
function rescaleParty(){
  if(!NET.host||scene!=='dungeon'||!run)return;
  const pm=partyMult(1+NET.guests.size),old=run.pm||1;if(Math.abs(pm-old)<1e-6)return;
  const k=pm/old;for(const e of en){e.hp*=k;e.max*=k;}run.pm=pm;
}
// ---- host receives ----
function onHostData(id,m){
  if(!m||typeof m!=='object')return;
  const g=NET.guests.get(id);if(!g)return;
  if(m.t==='hello'){
    if(!g.ok&&[...NET.guests.values()].filter(x=>x.ok).length>=UBC.maxPlayers-1){sendTo(id,{t:'full'});setTimeout(()=>dropGuest(id,'could not join (room full)'),300);return;}
    g.ok=true;upsertPlayer(id,{name:m.name,cls:m.cls,x:0,y:0,sc:'m',lvl:m.lvl});
    sendTo(id,{t:'welcome',id,code:NET.code,run:scene==='dungeon'&&run?{fi:run.floor,seed:M.seed,rid:NET.rid,start:run.startFloor,ps:run.ps||1,df:run.df}:null});
    for(const p of NET.players.values())if(p.id!==id)sendTo(id,Object.assign(stateOf(p),{from:p.id}));
    rescaleParty();return;
  }
  if(!g.ok)return;
  if(m.t==='hb')return;
  if(m.t==='st'){upsertPlayer(id,m);broadcast(Object.assign({},m,{from:id}),id,true);return;}
  if(m.t==='hit'){
    if(!Array.isArray(m.h)||m.rid!==NET.rid||scene!=='dungeon')return;
    const p=NET.players.get(id),lv=p?p.lvl:1,perHit=300+60*lv,perSec=3000+400*lv,t=now();
    if(t-g.dmgT>1000){g.dmgT=t;g.dmg=0;}
    for(const a of m.h.slice(0,120)){
      const e=en.find(o=>o.id===num(a[0]));if(!e||e.dead)continue;
      let d=clamp(num(a[1]),0,perHit);d=Math.min(d,Math.max(0,perSec-g.dmg));if(d<=0)break;g.dmg+=d;
      if(p&&Math.hypot(e.x-p.tx,e.y-p.ty)>420)continue; // can't hit what you're nowhere near
      applyDamage(e,d,{x:clamp(num(a[2]),-400,400),y:clamp(num(a[3]),-400,400)},clamp(num(a[4]),0,3),true);
    }
    return;
  }
  if(m.t==='atk'){const p=NET.players.get(id);if(p&&partyHere().includes(p))remoteAtk(p,String(m.k),num(m.a),num(m.tx),num(m.ty));broadcast(Object.assign({},m,{from:id}),id);return;}
  if(m.t==='rev'){
    const from=NET.players.get(id);if(!from||from.dead)return;
    if(m.to==='h'){if(Math.hypot(from.tx-pl.x,from.ty-pl.y)<40)revive(.4);return;}
    const tgt=NET.players.get(m.to);if(tgt&&tgt.dead&&Math.hypot(from.tx-tgt.tx,from.ty-tgt.ty)<40)sendTo(m.to,{t:'rev',to:m.to});return;
  }
  if(m.t==='sync'){if(scene==='dungeon'&&run)sendTo(id,{t:'start',fi:run.floor,seed:M.seed,rid:NET.rid,start:run.startFloor,ps:run.ps||1,df:run.df});return;}
  if(m.t==='bye'){dropGuest(id);}
}
function stateOf(p){return {t:'st',name:p.name,cls:p.cls,x:Math.round(p.tx),y:Math.round(p.ty),f:p.face,hp:p.hp,max:p.max,dead:p.dead?1:0,sc:p.sc,rid:p.rid,fl:p.fl,lvl:p.lvl,mv:p.mv?1:0};}
// ---- guest receives ----
function onGuestData(m){
  if(!m||typeof m!=='object')return;
  const from=m.from==='h'?'h':m.from;
  if(m.t==='hb')return;
  if(m.t==='full'){netReset();toast('That room is full (4 players max).','#ff3a4a');if(modal==='mp')showMultiplayer();return;}
  if(m.t==='bye'&&from==='h'){hostLost('The host closed the room. Your loot from this run is banked.');return;}
  if(m.t==='welcome'){NET.myId=m.id;if(m.run)NET.pending=m.run;return;}
  if(m.t==='st'){if(from&&from!==NET.myId)upsertPlayer(from,m);return;}
  if(m.t==='gone'){const p=NET.players.get(m.id);NET.players.delete(m.id);if(p)toast(`${esc(p.name)} left.`,'#ffd23a');return;}
  if(m.t==='atk'){const p=NET.players.get(from);if(p&&partyHere().includes(p))remoteAtk(p,String(m.k),num(m.a),num(m.tx),num(m.ty));return;}
  if(m.t==='rev'){if(m.to===NET.myId)revive(.4);return;}
  if(m.t==='start'){
    const r={fi:num(m.fi),seed:num(m.seed),rid:m.rid,start:m.start==null?num(m.fi):num(m.start),ps:clamp(num(m.ps)||1,1,5),df:m.df==null?null:clamp(num(m.df),0,3)};
    if(scene==='town'){closePanel();NET.rid=r.rid;startRun(r.start,{seed:r.seed,rid:r.rid,fi:r.fi,ps:r.ps,df:r.df});}else if(scene!=='dungeon')NET.pending=r;
    return;
  }
  if(m.t==='floor'){if(scene==='dungeon'&&run){closePanel();NET.rid=m.rid;fadeTo(()=>enterFloor(num(m.fi),num(m.seed),clamp(num(m.ps)||1,1,5)));}return;}
  if(m.t==='end'){if(scene==='dungeon'&&run){closePanel();endRun(m.how==='win'?'win':m.how==='dead'?'dead':'extract');}NET.pending=null;return;}
  if(m.t==='kill'){if(m.rid!==NET.rid||scene!=='dungeon')return;let e=en.find(o=>o.id===m.id);
    if(!e){if(!ED[m.type])return;e={id:m.id,type:m.type,d:ED[m.type],x:num(m.x),y:num(m.y),r:ED[m.type].r,xp:Math.round(ED[m.type].xp*(1+.3*run.floor)*(m.elite?4:1)),elite:!!m.elite,key:!!m.key,temp:true,dead:false};}
    e.x=num(m.x);e.y=num(m.y);e.key=!!m.key;e.elite=!!m.elite;killFx(e);en=en.filter(o=>!o.dead);return;}
  if(m.t==='ev'){if(m.rid!==NET.rid||scene!=='dungeon')return;applyEvents(m.ev);return;}
  if(m.t==='w'){if(m.rid!==NET.rid||scene!=='dungeon')return;if(num(m.q)<=NET.lastSeq&&NET.lastSeq-num(m.q)<1000)return;NET.lastSeq=num(m.q);applySnapshot(m);}
}
function applySnapshot(m){
  if(!Array.isArray(m.e))return;
  const seen=new Set(),t=time;
  for(const a of m.e){
    if(!Array.isArray(a))continue;const [id,ti,x,y,hp,mx,fl]=a;const type=ETYPES[ti];if(!type)continue;seen.add(id);
    let e=en.find(o=>o.id===id);
    if(!e){e=spawnEnemy(type,x,y,{elite:!!(fl&2),key:!!(fl&4),noAffx:true});e.id=id;e.state='chase';if(ED[type].boss){bossRef=e;if(!M.bossRoom){const r=M.rooms.find(q=>q.boss||q.exit);if(r)M.bossRoom=r;}}}
    e.tx=x;e.ty=y;e.max=mx;if(hp<e.hp||Math.abs(hp-e.hp)>e.max*.2||!(e.lastHit>t-.4))e.hp=hp;e.face=fl&1?-1:1;e.tele=fl&8?.2:0;if(fl&16)e.hitT=.09;e.stun=fl&32?.2:0;e.elite=!!(fl&2);e.key=!!(fl&4);
  }
  for(const e of en)if(!seen.has(e.id))e.dead=true; // out of range or dead; kill events carry the rewards
  en=en.filter(e=>!e.dead);
}
function applyEvents(ev){
  if(!Array.isArray(ev))return;
  for(const v of ev.slice(0,300)){
    if(!Array.isArray(v))continue;
    if(v[0]==='p')eproj.push({x:num(v[1]),y:num(v[2]),vx:num(v[3]),vy:num(v[4]),dmg:clamp(num(v[5]),0,200),col:String(v[6]).slice(0,9),r:clamp(num(v[7]),1,6),life:3});
    else if(v[0]==='mk')marks.push({k:v[1]==='line'?'line':'circle',x:num(v[2]),y:num(v[3]),r:num(v[4]),a:num(v[5]),len:num(v[6]),w:num(v[7]),warn:num(v[8]),dmg:clamp(num(v[9]),0,200),t:num(v[10])});
  }
}
const ETYPES=Object.keys(ED),ETI=Object.fromEntries(ETYPES.map((k,i)=>[k,i]));
// ---- per-frame network work ----
function netTick(dt){
  if(!NET.on||!pl)return;
  const t=now();
  NET.stT-=dt;if(NET.stT<=0){NET.stT=1/FAST_HZ;netSend(myState(),true);}
  NET.hbT-=dt;if(NET.hbT<=0){NET.hbT=1;netSend({t:'hb'});
    if(NET.host){for(const [id,g] of [...NET.guests])if(t-g.last>HB_TIMEOUT)dropGuest(id,'lost connection');}
    else if(NET.guest&&t-NET.hostLast>HB_TIMEOUT){hostLost();return;}
    for(const [id,p] of [...NET.players])if(t-(p.seen||0)>HB_TIMEOUT*2)NET.players.delete(id);
  }
  if(NET.host&&scene==='dungeon'&&NET.guests.size){
    if(NET.ev.length)broadcast({t:'ev',rid:NET.rid,ev:NET.ev.splice(0)});
    NET.snapT-=dt;if(NET.snapT<=0){NET.snapT=1/FAST_HZ;const q=++NET.snapSeq;
      for(const [id,g] of NET.guests){
        const p=NET.players.get(id);if(!g.ok||!p||p.sc!=='d'||p.rid!==NET.rid)continue;
        const e=[];for(const o of en){if(o.dead)continue;if(!o.d.boss&&Math.hypot(o.x-p.tx,o.y-p.ty)>520)continue;
          e.push([o.id,ETI[o.type],Math.round(o.x),Math.round(o.y),Math.ceil(o.hp),Math.round(o.max),(o.face<0?1:0)|(o.elite?2:0)|(o.key?4:0)|(o.tele>0?8:0)|(o.hitT>0?16:0)|(o.stun>0?32:0)]);}
        sendTo(id,{t:'w',rid:NET.rid,q,e},true);
      }}
  }
  if(NET.guest&&scene==='dungeon'){NET.hitT-=dt;if(NET.hitT<=0&&NET.hits.size){NET.hitT=.05;const h=[];for(const [id,v] of NET.hits)h.push([id,...v]);NET.hits.clear();netSend({t:'hit',rid:NET.rid,h});}}
}
function hostInRun(){for(const p of NET.players.values())if(p.id==='h'&&p.sc==='d'&&now()-(p.seen||0)<HB_TIMEOUT)return p;return null;}
function partyLine(){

}
